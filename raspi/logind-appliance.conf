[Login]
# This is an appliance whose only interface is the LCD HAT. Ignore the
# power/suspend/lid keys so nothing physical can shut it down - in
# particular an HDMI-CEC monitor connected for debugging shows up as a
# system power button (sunxi_cec) and its standby command would
# otherwise poweroff the board (radxa-01, 2026-09-15).
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
