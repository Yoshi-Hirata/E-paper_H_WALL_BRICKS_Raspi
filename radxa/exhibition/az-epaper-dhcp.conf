# EXHIBITION mode: DHCP reservations for the AZ-Epaper hotspot on radxa-05.
#
# NetworkManager's shared mode (ipv4.method shared) runs its own dnsmasq
# for the hotspot and hands 10.42.0.x addresses to whoever joins - and
# NM 1.42.4 (Debian 11's) has no ipv4.shared-dhcp-range to keep it off the
# units' static 10.42.0.1NN. dnsmasq reads this folder, so one reservation
# per unit (by its wlan0 MAC) means no phone can ever be handed a unit's
# address; the units keep their static client profiles as well.
#
# Install on radxa-05:
#     sudo cp radxa/exhibition/az-epaper-dhcp.conf /etc/NetworkManager/dnsmasq-shared.d/
#     sudo nmcli con down AZ-Epaper; sudo nmcli con up AZ-Epaper      # re-reads it
#
# A unit's MAC:  cat /sys/class/net/wlan0/address     (on that unit)
# Read 2026-09-30 for the units below; 06 and 08 were not reachable that
# day - fill them in (uncomment) once read.
dhcp-host=ec:b5:0a:6a:1f:53,10.42.0.101,radxa-01
dhcp-host=ec:b5:0a:6a:20:15,10.42.0.102,radxa-02
dhcp-host=ec:b5:0a:6a:29:fd,10.42.0.103,radxa-03
dhcp-host=ec:b5:0a:6a:21:80,10.42.0.104,radxa-04
# radxa-05 ec:b5:0a:6a:1f:4f is the hotspot itself (10.42.0.1): no lease
#dhcp-host=xx:xx:xx:xx:xx:xx,10.42.0.106,radxa-06
dhcp-host=ec:b5:0a:6a:2a:63,10.42.0.107,radxa-07
#dhcp-host=xx:xx:xx:xx:xx:xx,10.42.0.108,radxa-08
dhcp-host=ec:b5:0a:6a:1f:45,10.42.0.109,radxa-09
dhcp-host=ec:b5:0a:6a:20:18,10.42.0.110,radxa-10
