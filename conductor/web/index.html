<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-paper Show Conductor</title>
<style>
:root {
  --bg: #f4f4f6; --panel: #ffffff; --ink: #1d1d24; --dim: #6b6b78;
  --line: #dcdce3; --accent: #0a62c9; --ok: #12834a; --err: #c62828;
  --warn: #a15c00; --select: #e6f0fc; --garment: #ececf0; --hold: #dfe7f3;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15161a; --panel: #1e2026; --ink: #ececf1; --dim: #9a9aa8;
    --line: #33353f; --accent: #6db3ff; --ok: #5fd896; --err: #ff7b7b;
    --warn: #ffb860; --select: #243347; --garment: #2a2c35; --hold: #2b3444; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
  background: var(--bg); color: var(--ink); }
header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
header .ws { color: var(--dim); font-size: 12px; margin-left: auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
button, select, input[type=text], .filebtn { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button, select, .filebtn { cursor: pointer; }
button:hover, .filebtn:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger:hover { border-color: var(--err); color: var(--err); }
button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
.filebtn input { display: none; }
.tabs { display: flex; gap: 0; }
.tabs button { border-radius: 0; margin-left: -1px; padding: 5px 16px; }
.tabs button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.tabs button:last-child { border-radius: 0 6px 6px 0; }
main { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 50px); }
main.wide { grid-template-columns: 1fr; }
main.wide aside { display: none; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; }
aside h2, .card h2 { font-size: 11px; letter-spacing: .1em; color: var(--dim);
  margin: 14px 0 6px; font-weight: 600; }
.card h2 { margin-top: 0; }
.unit { font-size: 12px; color: var(--dim); margin: 12px 0 4px; font-weight: 600; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  margin-bottom: 6px; cursor: pointer; }
.item.sel { background: var(--select); border-color: var(--accent); }
.item .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.meta { color: var(--dim); font-size: 12px; }
.item select { margin-top: 6px; width: 100%; padding: 2px 6px; font-size: 12px; }
.item .name em { font-style: normal; font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
.item .lab { font: inherit; font-weight: 600; color: inherit; background: transparent; min-width: 0;
  border: 1px solid transparent; border-radius: 4px; padding: 1px 4px; }
.item .lab:hover { border-color: var(--line); }
.item .lab:focus { border-color: var(--accent); background: var(--bg); outline: none; }
.item .lab.look { width: 40px; flex: none; }
.item .lab.model { flex: 1; font-weight: 500; font-size: 12px; }
td input.bno { width: 56px; padding: 1px 4px; font: inherit; }
.item .where { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.item .where select { margin-top: 0; flex: 1; min-width: 0; }
.item .where button { font-size: 11px; padding: 2px 8px; flex: none; }
.slot b { font-weight: 600; margin-right: 6px; }
.grip { cursor: grab; color: var(--dim); font-size: 14px; line-height: 1; padding: 0 2px; margin-left: auto;
  user-select: none; flex: none; }
.grip:active { cursor: grabbing; }
.place { border-radius: 8px; padding: 1px 0; }
.place.moving { opacity: .4; }
.place.over { outline: 2px solid var(--accent); outline-offset: 1px; }
.place.over.before { box-shadow: 0 -4px 0 -1px var(--accent); outline: none; }
.place.over.after { box-shadow: 0 4px 0 -1px var(--accent); outline: none; }
.slot { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
  color: var(--dim); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
.dot.none { background: var(--line); }
#content { padding: 14px 18px 40px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 10px; }
.group { display: flex; gap: 4px; align-items: center; }
.group > span { color: var(--dim); font-size: 12px; margin-right: 4px; }
.group button { border-radius: 0; margin-left: -1px; }
.group button:first-of-type { border-radius: 6px 0 0 6px; margin-left: 0; }
.group button:last-of-type { border-radius: 0 6px 6px 0; }
#stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; overflow-x: auto; }
#stage svg { display: block; margin: 0 auto; }
#info { min-height: 24px; margin: 8px 2px; color: var(--dim); font-size: 13px; }
#info b { color: var(--ink); }
.cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.card + .card { margin-top: 12px; }
.problems { margin: 0; padding-left: 18px; }
.problems li { color: var(--err); margin: 2px 0; font-size: 13px; }
.okline { color: var(--ok); }
.warn { color: var(--warn); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .06em; }
tbody tr.pick { cursor: pointer; } tbody tr.pick:hover { background: var(--select); }
tbody tr.hl { background: var(--select); outline: 1px solid var(--accent); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
  border: 1px solid var(--line); vertical-align: -2px; margin-right: 6px; }
.files { font-size: 12px; color: var(--dim); }
.files span { display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; }
.files button, td button { padding: 0 6px; font-size: 11px; }
#drop { position: fixed; inset: 0; background: rgba(10, 98, 201, .18); border: 4px dashed var(--accent);
  display: none; align-items: center; justify-content: center; font-size: 22px; font-weight: 600;
  color: var(--accent); z-index: 10; pointer-events: none; }
#drop.on { display: flex; }
#toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; display: none; max-width: 60vw; font-size: 13px; z-index: 11; }
.empty { color: var(--dim); padding: 60px 0; text-align: center; }

/* ---- timeline ---- */
.tl-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; min-height: 38px;
  border-bottom: 1px solid var(--line); }
.tl-name { font-size: 13px; font-weight: 600; padding-right: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-name small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
.tl-track { position: relative; height: 30px; background: var(--bg); border-radius: 4px; cursor: copy; }
.tl-ruler { position: relative; height: 20px; font-size: 11px; color: var(--dim); cursor: pointer; }
.tl-ruler i { position: absolute; top: 0; height: 20px; border-left: 1px solid var(--line); pointer-events: none; }
.tl-ruler span { position: absolute; top: 1px; transform: translateX(3px); pointer-events: none; }
.cue-band { position: absolute; top: 3px; bottom: 3px; border-radius: 3px 0 0 3px; cursor: pointer;
  background: repeating-linear-gradient(135deg, var(--accent) 0 4px, transparent 4px 8px); opacity: .55; }
.cue-hold { position: absolute; top: 3px; bottom: 3px; background: var(--hold); border-radius: 0 3px 3px 0;
  cursor: pointer; overflow: hidden; white-space: nowrap; font-size: 11px; line-height: 24px; padding-left: 5px;
  border-left: 2px solid var(--accent); }
.cue-hold.bad { border-left-color: var(--err); color: var(--err); }
.cue-hold.sel, .cue-band.sel { outline: 2px solid var(--accent); z-index: 2; opacity: 1; }
.cue-hold .chips { display: inline-flex; gap: 1px; margin-right: 5px; vertical-align: -1px; }
.cue-hold .chips b { width: 7px; height: 10px; display: inline-block; border: 1px solid rgba(128,128,128,.5); }
.tl-wrap { position: relative; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--err); pointer-events: none; z-index: 3; }
.editor { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.editor label { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.editor input[type=text] { width: 70px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 12px; }
.thumb { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; flex: 1 1 260px; max-width: 420px; }
.thumb .t { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.thumb .t span { font-weight: 400; color: var(--dim); }
.thumb .t .chg { color: var(--warn); }
input[type=range] { width: 100%; }

/* ---- fleet ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; }
.tile.off { opacity: .55; }
.tile .n { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile .n .ph { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 9px; border: 1px solid var(--line); }
.ph.ready, .ph.armed, .ph.fired { color: var(--ok); border-color: var(--ok) !important; }
.ph.failed { color: var(--err); border-color: var(--err) !important; }
.ph.preparing { color: var(--accent); border-color: var(--accent) !important; }
.tile .row { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); }
.tile .row b { color: var(--ink); font-weight: 500; }
.tile .e { color: var(--err); }
.tile .l { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.go { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 10px; }
.go button.big { padding: 7px 16px; font-weight: 600; }
.go button.fire { background: var(--ok); border-color: var(--ok); color: #fff; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 16px; }
.picks label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.picks label span { min-width: 120px; } .picks select { flex: 1; min-width: 0; }
.showbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.showclock { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; min-width: 150px; }
.showclock small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--dim); margin-bottom: 4px; }
.showclock.running small { color: var(--ok); } .showclock.holding small { color: var(--warn); }
.shownext { font-size: 13px; color: var(--dim); min-width: 220px; }
.shownext b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
.go button.hold { background: var(--warn); border-color: var(--warn); color: #fff; }
.go button.stop:hover { border-color: var(--err); color: var(--err); }
body.busy .go button { opacity: .45; pointer-events: none; }
.card h2 + .sub { margin: -2px 0 8px; }
.cue-hold, .cue-band { min-width: 7px; }
.cue-hold { cursor: grab; } .cue-hold.dragging { cursor: grabbing; opacity: .8; z-index: 4; outline: 2px dashed var(--accent); }
</style>
</head>
<body>
<header>
  <h1>E-PAPER SHOW CONDUCTOR</h1>
  <div class="tabs">
    <button data-tab="items">Designs</button><button data-tab="timeline">Timeline</button><button data-tab="fleet">Units</button>
  </div>
  <div class="tabs">
    <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo ↷</button>
  </div>
  <label class="filebtn">Add CSV<input id="pick" type="file" accept=".csv" multiple></label>
  <span class="meta">or drop CSV files anywhere on the page</span>
  <span class="ws" id="ws"></span>
</header>
<main id="main">
  <aside>
    <h2>ITEMS (LOOKS / BAGS)</h2>
    <div id="items"></div>
    <div id="orphans"></div>
  </aside>
  <div id="content"></div>
</main>
<div id="drop">Drop the CSV files here</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ui = { tab: "items", item: null, design: null, mode: "design", view: "outside",
             board: null, cue: null, playhead: 0, choices: {}, lead: 3, goLog: "", showLog: "" };
let fleet = null;
let state = null;
const PITCH = 0.78, MARGIN = 1.2;

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify(body) } : undefined);
  return res.json();
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 6000);
}
const clock = s => { const n = Math.round(Math.abs(s)); return (s < 0 ? "-" : "") + Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); };
function parseClock(text) {                       // "3:20" or "200" -> seconds
  const m = String(text).trim().match(/^(?:(\d+):)?(\d{1,4})$/);
  if (!m) return null;
  if (m[1] !== undefined && Number(m[2]) >= 60) return null;     // "3:75" is a typo
  return (m[1] !== undefined ? Number(m[1]) * 60 : 0) + Number(m[2]);
}
const hex = c => "0x" + Number(c).toString(16).toUpperCase().padStart(2, "0");
const rgb = c => `rgb(${state.palette[c].rgb.join(",")})`;
// What an item is called: its LOOK number and model number (both editable in the
// list on the Designs tab); the file name's prefix when it has neither.
const itemName = i => !i ? "" : i.look ? "LOOK " + i.look : i.item;
const itemFull = i => !i ? "" : [i.look ? "LOOK " + i.look : "", i.model].filter(Boolean).join(" · ") || i.item;
const itemByKey = key => state.items.find(i => i.item === key);
const designLabel = d => d.label || d.name;

async function refresh() {
  state = await api("/api/state");
  $("#ws").textContent = "workspace: " + state.workspace;
  if (!state.items.some(i => i.item === ui.item)) ui.item = state.items[0]?.item ?? null;
  render();
}
function render() {
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === ui.tab));
  $("#undo").disabled = !state.history.undo;
  $("#redo").disabled = !state.history.redo;
  $("#main").classList.toggle("wide", ui.tab !== "items");
  renderSidebar();
  if (ui.tab === "timeline") renderTimeline();
  else if (ui.tab === "fleet") renderFleet();
  else renderContent();
}
// A design is ok (every scale coloured), partial (some left "-": fine as a
// partial cue) or bad (wrong even as a partial cue).
const designState = d => !d.problems.length ? "ok" : !d.partial_problems.length ? "partial" : "bad";
const designBadge = d => ({ ok: `<span class="okline">OK</span>`,
  partial: `<span class="warn">partial only</span>`,
  bad: `<span style="color:var(--err)">${d.partial_problems.length} problems</span>` }[designState(d)]);
function problemsOf(item) {
  return item.problems.length + item.designs.reduce((n, d) => n + d.partial_problems.length, 0);
}

function itemCard(item) {
  const bad = problemsOf(item);
  const dot = !item.map ? "none" : bad ? "err" : "ok";
  return `<div class="item ${item.item === ui.item ? "sel" : ""}" data-item="${esc(item.item)}">
    <div class="name"><span class="dot ${dot}"></span><em>LOOK</em>
      <input class="lab look" data-label="look" value="${esc(item.look)}" placeholder="–" maxlength="40" title="LOOK number (click to edit)">
      <input class="lab model" data-label="model" value="${esc(item.model)}" placeholder="model no." maxlength="40" title="Model number (click to edit)">
      <span class="grip" draggable="true" title="Drag to another unit: everything in between moves along">⠿</span></div>
    <div class="meta">${esc(item.item)}_*.csv · ${item.map ? `${item.map.scales.length} scales / ${item.boards.length} boards / ${item.designs.length} designs` : "no map CSV"}
      ${bad ? ` · <span style="color:var(--err)">${bad} problems</span>` : ""}</div>
    <div class="where"><select data-assign="${esc(item.item)}">
      <option value="">Unit: unassigned</option>
      ${state.units.map(u => `<option ${u === item.unit ? "selected" : ""}>${u}</option>`).join("")}
    </select>${!item.map ? "" :
      `<button data-copy="${esc(item.item)}" title="Another garment of the same shape, as an item of its own: the map CSV is copied under a new name. Designs, cues and board numbers are separate from then on.">Duplicate</button>`}</div></div>`;
}
function renderSidebar() {
  // One slot per unit, carried or not: ten units, ten garments or bags.
  let html = "";
  for (const unit of state.units) {
    const carried = state.items.filter(i => i.unit === unit);
    html += `<div class="place" data-place="${esc(unit)}">`
      + (carried.map(itemCard).join("") || `<div class="slot"><b>${esc(unit)}</b>no item yet</div>`) + `</div>`;
  }
  html += state.items.filter(i => !state.units.includes(i.unit)).map(itemCard).join("");
  $("#items").innerHTML = html;
  $("#orphans").innerHTML = state.orphans.length
    ? `<h2>DESIGNS WAITING FOR A MAP</h2>` + state.orphans.map(o =>
        `<div class="files"><span>${esc(o.name)} <button data-del="${esc(o.name)}">×</button></span></div>`).join("")
    : "";
}

// ---- the garment ----
function tint(index, count) {
  return `hsl(${Math.round(360 * index / Math.max(count, 1))} 62% ${index % 2 ? 62 : 46}%)`;
}
function shiftOf(shifts, side, row) {
  const s = shifts?.[`${side}|${row}`];
  return s !== undefined ? s : (row % 2 ? 0.5 : 0);
}
// opts: {cell, mode, colors, undecided, shifts, labels}
function renderGarment(item, opts) {
  const cell = opts.cell, scales = item.map.scales;
  const rows = scales.map(s => s[1]), cols = scales.map(s => s[2]);
  const top = Math.max(...rows), low = Math.min(...rows);
  const lowCol = Math.min(...cols), span = Math.max(...cols) - lowCol + 1.5;
  const margin = opts.labels ? MARGIN : 0.4;
  const sideW = (span + 2 * margin) * cell;
  const head = opts.labels ? 26 : 0;
  const bodyH = ((top - low) * PITCH + 1 + 2 * margin) * cell;
  const order = item.boards.map(b => b.board_no);
  const sides = item.map.sides;
  const W = sideW * sides.length, H = bodyH + head;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${opts.labels ? W + "px" : "100%"};height:auto"
    viewBox="0 0 ${W} ${H}" font-family="Segoe UI, sans-serif">`;
  sides.forEach((side, index) => {
    const x0 = index * sideW;
    if (opts.labels) {
      const label = { front: "FRONT", back: "BACK" }[side] || side.toUpperCase();
      svg += `<text x="${x0 + margin * cell}" y="17" font-size="12" fill="var(--dim)">${esc(label)}</text>`;
    }
    const here = scales.filter(s => s[0] === side).sort((a, b) => a[1] - b[1] || a[2] - b[2]);
    for (const [sd, row, col, boardNo, socket] of here) {
      let cx = (margin + col - lowCol + shiftOf(opts.shifts, side, row) + 0.5) * cell;
      if (ui.view === "outside") cx = sideW - cx;            // the files are drawn from the inside
      const cy = head + (margin + (top - row) * PITCH + 0.5) * cell;
      const key = `${side}|${row}|${col}`;
      let fill, text = "";
      if (opts.mode === "design") {
        const code = opts.colors[key];
        fill = code !== undefined ? rgb(code) : "var(--garment)";
        if (code === undefined && opts.labels) text = opts.undecided?.includes(key) ? "-" : "?";
      } else { fill = tint(order.indexOf(boardNo), order.length); text = socket; }
      const dim = ui.board !== null && opts.labels && ui.board !== boardNo ? ` opacity=".18"` : "";
      svg += `<g${dim}${opts.labels ? ` data-k="${key}" data-b="${boardNo}" data-s="${socket}"` : ""}>
        <circle cx="${(x0 + cx).toFixed(1)}" cy="${cy.toFixed(1)}" r="${cell / 2}" fill="${fill}" stroke="#7d7d88" stroke-width="${opts.labels ? .7 : .3}"/>` +
        (text !== "" ? `<text x="${(x0 + cx).toFixed(1)}" y="${(cy + 3).toFixed(1)}" font-size="8.5" text-anchor="middle"
          fill="${opts.mode === "design" ? "var(--err)" : "#fff"}" pointer-events="none">${text}</text>` : "") + `</g>`;
    }
  });
  return svg + "</svg>";
}

// ---- tab 1: one item's designs ----
function renderContent() {
  const item = state.items.find(i => i.item === ui.item);
  const root = $("#content");
  if (!item) { root.innerHTML = `<div class="empty">Add the map and grid CSV files (an item can have any number of designs).</div>`; return; }
  if (!item.map || !item.map.scales.length) {

function trackItems() { return state.items.filter(i => i.map && i.map.scales.length); }

// delay, and it is done one refresh after that.
function sweptColors(item, cue, design, t) {
  const ranks = item.sequences?.[cue.sequence];
  if (!ranks) return design.colors;
  const refresh = state.show.refresh_s, done = {};
  item.map.scales.forEach((s, n) => {
    const key = `${s[0]}|${s[1]}|${s[2]}`;
    if (key in design.colors && cue.sent + ranks[n] * cue.step_s + refresh <= t) done[key] = design.colors[key];
  });

}
function wornAt(item, t) {

  let colors = {}, shifts = null, label = "(as before the show)", changing = false;
  for (const cue of cuesOf(item)) {
    const design = item.designs.find(d => d.name === cue.design);
    if (cue.sent <= t && t < cue.complete) changing = true;
    if (!design) continue;
    if (cue.complete > t) {
      if (cue.sequence !== "natural" && cue.sent <= t) colors = { ...colors, ...sweptColors(item, cue, design, t) };
      continue;

    shifts = design.shifts; label = designLabel(design) + (cue.partial ? " (partial)" : "");

}

function showClockText() {
  const box = $("#show-clock");
  if (!box || !fleet) return;
  const run = fleet.run;
  let now = null, word = "NOT STARTED";
  if (run) {
    now = run.state === "holding" ? run.now : run.now + (performance.now() - fleet.at) / 1000;
    word = run.state === "holding" ? "ON HOLD" : now < 0 ? "STARTS IN" : "RUNNING" + (run.adopted ? " (RECOVERED FROM THE UNITS)" : "");
    if (run.state === "running" && now > state.show.duration) word = "ENDED";
  }
  box.className = "showclock " + (run ? run.state : "");
  box.innerHTML = `<small>${word}</small>${now === null ? "0:00" : clock(now)}`;
  const upcoming = fleet.units.filter(u => u.online && u.show && u.show.next).map(u => ({ unit: u.name, ...u.show.next }))
    .sort((a, b) => a.in_s - b.in_s);
  const loaded = fleet.units.filter(u => u.online && u.show && fleet.shows[u.name] && u.show.id === fleet.shows[u.name].id).length;
  const want = Object.keys(fleet.shows).length;
  $("#show-next").innerHTML = (run && run.state === "running" && upcoming.length
      ? `<b>Next: ${esc(upcoming[0].label || upcoming[0].id)}</b>${esc(upcoming[0].unit)} sends it in about ${Math.max(0, Math.round(upcoming[0].in_s - (performance.now() - fleet.at) / 1000))} s`
      : `<b>${run ? (run.state === "holding" ? "On hold" : "No cue ahead") : "—"}</b>`)
    + `<br>uploaded to ${loaded} / ${want} units`;
  $("#show-fix").innerHTML = fleet.corrections.length
    ? "Corrected automatically: " + fleet.corrections.map(esc).join(" · ") : "";
  const running = !!run && run.state === "running", holding = !!run && run.state === "holding";
  // Units can be running a show this conductor knows nothing of yet (it was
  // restarted; the run is adopted a poll or two later, or never if the units
  // themselves came back unsynced). STOP must work then more than ever.
  const unitsBusy = fleet.units.some(u => u.online && u.show && ["running", "holding"].includes(u.show.state));
  const able = { "show-preset": want > 0 && !run && !unitsBusy, "show-start": want > 0,
                 "show-hold": running, "show-resume": holding,
                 "show-next-cue": (running && upcoming.length > 0) || holding, "show-stop": !!run || unitsBusy,
                 "fleet-prepare": !run && !unitsBusy && assignedItems().length > 0, "fleet-fire": !run && !unitsBusy };
  for (const [id, on] of Object.entries(able)) { const b = $("#" + id); if (b) b.disabled = !on; }
  const hint = $("#show-hint");
  if (hint) hint.textContent = !want ? (unitsBusy
      ? "Units are running a show this conductor did not upload (it was restarted). STOP works; Upload again to take the show over."
      : "Upload the show first.") : loaded < want
    ? `${want - loaded} unit(s) do not hold this show yet - they are corrected automatically once they answer.` : "";
}

  if (!box || !fleet) return;
  const picked = getSelection();
  if (picked && !picked.isCollapsed && box.contains(picked.anchorNode)) return;   // being copied
  const carried = {};
  for (const item of trackItems()) if (item.unit) (carried[item.unit] ||= []).push(item);
  box.innerHTML = fleet.units.map(u => {
    const items = carried[u.name] || [], expected = items.reduce((n, i) => n + i.boards.length, 0);
    const phase = u.online ? (u.phase || "?") : "offline";
    return `<div class="tile ${u.online ? "" : "off"}">
      <div class="n"><span class="dot ${u.online ? "ok" : "none"}"></span>${esc(u.name)}<span class="ph ${esc(phase)}">${esc(phase)}</span></div>
      <div class="row"><span>Item</span><b>${esc(items.map(itemFull).join(" + ") || "—")}</b></div>
      ${u.online ? `
      <div class="row"><span>Boards (answering / expected)</span><b>${u.live} / ${expected || u.boards || "?"}</b></div>
      <div class="row"><span>Clock accuracy · round trip</span><b>±${u.sync_ms ?? "?"} ms · ${u.rtt_ms ?? "?"} ms</b></div>
      <div class="row"><span>Loaded</span><b>${u.cue ? `${esc(u.label || u.cue)} — ${u.saved}/${u.boards}` + (u.prepare_s ? ` (${u.prepare_s.toFixed(1)} s)` : "") : "—"}</b></div>
      <div class="row"><span>Fired late by</span><b>${u.late_ms === null || u.late_ms === undefined ? "—" : (u.late_ms >= 0 ? "+" : "") + u.late_ms + " ms"}</b></div>
      <div class="row"><span>Show</span><b>${u.show ? `${fleet.shows[u.name] ? (fleet.shows[u.name].id === u.show.id ? "✓" : "✗ old version") : ""} ${esc(u.show.state)}${u.show.synced === false && u.show.state === "running" ? " (unsynced)" : ""} · ${esc(u.show.applied || "—")} / ${esc(u.show.cues)}` : "—"}</b></div>
      <div class="row"><span>Commit</span><b>${esc(u.commit || "?")}</b></div>
      ${u.failed.length ? `<div class="e">Boards not written: ${esc(u.failed.join(", "))}</div>` : ""}
      ${u.unit_error ? `<div class="e">${esc(u.unit_error)}</div>` : ""}
      <div class="l" title="${esc(u.log.join("\n"))}">${esc(u.log[u.log.length - 1] || "")}</div>`
      : `<div class="row"><span>${esc(u.address)}</span></div><div class="l">${esc(u.error || "no answer")}</div>`}
    </div>`; }).join("");
}
async function pollFleet() {
  if (ui.tab === "fleet" && !document.hidden) {
    try { fleet = await api("/api/fleet"); fleet.at = performance.now(); renderTiles(); } catch (err) { /* the server is restarting */ }
  }
  setTimeout(pollFleet, 1000);
}
function unitReport(result) {
  const lines = Object.entries(result.units || {}).sort().map(([unit, r]) => `${unit}: ${r.ok ? "OK" : "FAILED — " + r.error}`);
  return [...(result.problems || []), ...lines].join("\n") || result.error || result.note || "No unit to send to";
}
let commandInFlight = false;
async function fleetCommand(command, body, title, slot = "go") {
  if (commandInFlight) return;                    // a double click must not send it twice
  commandInFlight = true; document.body.classList.add("busy");
  const key = slot === "go" ? "goLog" : "showLog", box = () => $("#" + slot + "-log");
  try {
    ui[key] = title + " …"; if (box()) box().textContent = ui[key];
    const result = await api("/api/fleet/" + command, body);
    ui[key] = `${title} (${new Date().toLocaleTimeString()})\n` + unitReport(result);
    if (box()) box().textContent = ui[key];
    fleet = await api("/api/fleet"); fleet.at = performance.now(); renderTiles();
  } catch (err) {
    ui[key] = `${title}: no answer from the conductor server (${err.message})`;
    if (box()) box().textContent = ui[key];
  } finally { commandInFlight = false; document.body.classList.remove("busy"); }
}

// ---- events ----
// Undo covers the show (timeline, length, unit assignments); the server keeps the history.
async function step(which) {
  const result = await api("/api/" + which, {});
  if (!result.ok) { toast(which === "undo" ? "Nothing to undo" : "Nothing to redo"); return; }
  await refresh();
  if (!state.show.cues.some(c => c.id === ui.cue)) ui.cue = null;
  render();
}
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key !== "z" && key !== "y") return;
  // Inside a text box Ctrl+Z belongs to the typing, not to the show.
  if (e.target.matches("input[type=text], textarea")) return;
  e.preventDefault();
  step(key === "y" || e.shiftKey ? "redo" : "undo");
});
document.addEventListener("click", async e => {
  if (Date.now() - draggedAt < 400) return;   // the tail of a drag, not a click
  if (e.target.id === "undo" || e.target.id === "redo") { step(e.target.id); return; }
  const showButtons = { "show-upload": ["upload", "① Upload"], "show-preset": ["preset", "② Show preset"],
    "show-hold": ["hold", "HOLD"], "show-resume": ["resume", "RESUME"] };
  if (showButtons[e.target.id]) { const [command, title] = showButtons[e.target.id]; await fleetCommand(command, {}, title, "show"); return; }
  if (e.target.id === "show-start") {
    const again = !!fleet?.run;
    if (again && !confirm("The show is running. Start it again from 0:00?")) return;
    await fleetCommand("start", { lead_s: ui.lead, force: again }, `③ START (in ${ui.lead} s)`, "show"); return;
  }
  if (e.target.id === "show-next-cue") { await fleetCommand("next", { lead_s: ui.lead }, `NEXT (next cue in ${ui.lead} s)`, "show"); return; }
  if (e.target.id === "show-stop") {
    if (confirm("Stop the show? The panels keep what they are showing.")) await fleetCommand("stop", {}, "STOP", "show");
    return;
  }
  if (e.target.id === "fleet-prepare") {
    const choices = Object.fromEntries(assignedItems().map(i => [i.item, ui.choices[i.item]]));
    await fleetCommand("prepare", { choices }, "Prepare"); return;
  }
  if (e.target.id === "fleet-fire") { await fleetCommand("fire", { lead_s: ui.lead }, `GO (in ${ui.lead} s)`); return; }
  if (e.target.id === "fleet-cancel") { await fleetCommand("cancel", {}, "Cancel the fire"); return; }
  if (e.target.id === "fleet-standby") {
    if (confirm("Turn the panels of every answering unit white (STANDBY)?")) await fleetCommand("standby", {}, "All units STANDBY");
    return;
  }
  if (e.target.id === "fleet-release") {
    if (confirm("Hand every unit back to its own buttons? A running show stops on the units.")) await fleetCommand("release", {}, "Release to on-device control");
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) { ui.tab = tab.dataset.tab; render(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    const made = await api("/api/duplicate", { item: copy.dataset.copy });
    if (made.item) { ui.item = made.item; ui.design = null; toast(`${made.item}_map.csv made - an item of its own. Add its design CSVs with "Add CSV to this item".`); }
    else toast(made.error || "");
    refresh(); return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    if (confirm("Delete " + del.dataset.del + " from the workspace?")) { await api("/api/delete", { name: del.dataset.del }); refresh(); }
    return;
  }
  const set = e.target.closest("[data-set]");
  if (set) { ui[set.dataset.set] = set.dataset.value; renderContent(); return; }
  const dr = e.target.closest("tr[data-design]");
  if (dr) { ui.design = dr.dataset.design; ui.mode = "design"; renderContent(); return; }
  const row = !e.target.closest("input") && e.target.closest("tr[data-board]");
  if (row) { const b = Number(row.dataset.board); ui.board = ui.board === b ? null : b; renderContent(); return; }

  const cueEl = e.target.closest("[data-cue]");
  if (cueEl) {
    ui.cue = cueEl.dataset.cue;
    const c = state.show.cues.find(x => x.id === ui.cue);
    if (c) ui.playhead = Math.min(state.show.duration, Math.round(c.complete));
    renderTimeline(); return;
  }
  if (e.target.id === "cue-del") { await saveShow(state.show.cues.filter(c => c.id !== ui.cue)); return; }
  if (e.target.id === "cue-all") {
    const from = state.show.cues.find(c => c.id === ui.cue), added = [];
    for (const item of trackItems()) {
      const mine = cuesOf(item);
      if (item.item === from.item || !item.designs.length || mine.some(c => c.at === from.at)) continue;
      const usable = item.designs.filter(d => designState(d) !== "bad");
      const next = usable.find(d => !mine.some(c => c.design === d.name)) || usable[0];
      if (next) added.push({ id: "c" + Math.random().toString(36).slice(2, 10), item: item.item, at: from.at,
                             design: next.name, align: from.align, partial: designState(next) === "partial" });
    }
    if (!added.length) { toast("Every other item already has a cue at this time"); return; }
    await saveShow([...state.show.cues, ...added]); toast(`Added ${added.length} cue(s) at ${clock(from.at)}`); return;
  }
  if (e.target.id === "cue-show") {
    const c = state.show.cues.find(x => x.id === ui.cue);
    ui.tab = "items"; ui.item = c.item; ui.design = c.design; ui.mode = "design"; ui.board = null; render(); return;
  }
  const track = e.target.closest("[data-track]");
  if (track) {
    const item = state.items.find(i => i.item === track.dataset.track);
    if (!item.designs.length) { toast(item.item + " has no design CSV yet"); return; }
    const box = track.getBoundingClientRect();
    let at = Math.round((e.clientX - box.left) / box.width * state.show.duration / 5) * 5;
    if (at < state.show.refresh_s) at = 0;                     // too early to finish a refresh: the preset
    const mine = cuesOf(item);
    const next = item.designs.find(d => !mine.some(c => c.design === d.name)) || item.designs[0];
    const id = "c" + Math.random().toString(36).slice(2, 10);
    ui.cue = id; ui.playhead = at;
    await saveShow([...state.show.cues, { id, item: item.item, at, design: next.name, align: "done",
                                          partial: designState(next) === "partial" }]);
    return;
  }
  const ruler = e.target.closest("#ruler");
  if (ruler) {
    const box = ruler.getBoundingClientRect();
    ui.playhead = Math.max(0, Math.min(state.show.duration, Math.round((e.clientX - box.left) / box.width * state.show.duration)));
    $("#ph").value = ui.playhead; renderThumbs(); return;
  }
  if (e.target.closest("select, input, button, label")) return;
  const card = e.target.closest(".item");
  if (card) { ui.item = card.dataset.item; ui.design = null; ui.board = null; ui.mode = "design"; render(); }
});
// Enter ends the typing in a label or a board number (leaving the field saves it).
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.("input.lab, input.bno")) e.target.blur();
});
document.addEventListener("change", async e => {
  const id = e.target.id;
  if (e.target.dataset.choice !== undefined) { ui.choices[e.target.dataset.choice] = e.target.value; return; }
  if (id === "fleet-lead") {
    const seconds = Number(e.target.value);
    if (seconds >= 0.5 && seconds <= 60) ui.lead = seconds; else { toast("Enter 0.5 to 60 seconds"); e.target.value = ui.lead; }
    return;
  }
  if (id === "design") { ui.design = e.target.value; renderContent(); }
  else if (id === "pick") { upload(e.target.files); e.target.value = ""; }
  else if (id === "pick-own") { uploadOwn(itemByKey(ui.item), e.target.files); e.target.value = ""; }
  else if (id === "duration") {
    const seconds = parseClock(e.target.value);
    if (seconds === null || seconds < 1) { toast("Enter the length as m:ss"); renderTimeline(); return; }
    ui.playhead = Math.min(ui.playhead, seconds); await saveShow(state.show.cues, seconds);
  } else if (id === "refresh") {
    const seconds = Number(e.target.value);
    if (!(seconds >= 1 && seconds <= 60)) { toast("Enter a refresh time of 1 to 60 seconds"); renderTimeline(); return; }
    await saveShow(state.show.cues, undefined, seconds);
  } else if (id.startsWith("cue-")) {
    const cues = state.show.cues.map(c => ({ ...c })), cue = cues.find(c => c.id === ui.cue);
    if (!cue) return;
    if (id === "cue-start" || id === "cue-end") {
      const seconds = parseClock(e.target.value);
      if (seconds === null) { toast("Enter the time as m:ss (e.g. 3:20)"); renderTimeline(); return; }
      const refresh = state.show.refresh_s;
      if (id === "cue-end") {
        cue.at = seconds; cue.align = "done";               // complete at this time
      } else if (cue.sequence === "natural") {
        cue.at = seconds; cue.align = "start";              // begins at this time
      } else {
        // A sweep: keep the end, and make the sweep last from this start to it.
        const ranks = itemByKey(cue.item)?.sequences?.[cue.sequence];
        const steps = ranks ? Math.max(...ranks) : 0;
        const span = cue.complete - seconds - refresh;
        if (steps < 1) { toast("This item's map is needed to time the sweep"); renderTimeline(); return; }
        if (span < 0.1 * steps - 1e-9) { toast(`Too short: ${steps} steps of at least 0.1 s plus the ${refresh} s refresh need ${clock(cue.complete - refresh - 0.1 * steps)} or earlier`); renderTimeline(); return; }
        if (span > 5 * steps + 1e-9) { toast(`Too long: the step is at most 5 s, so the sweep starts at ${clock(cue.complete - refresh - 5 * steps)} at the earliest`); renderTimeline(); return; }
        cue.step_s = Math.round(span / steps * 10) / 10;
        cue.at = cue.complete; cue.align = "done";
      }
    } else if (id === "cue-design") {
      cue.design = e.target.value;                          // a design with "-" holes can only be a partial cue
      const d = state.items.find(i => i.item === cue.item)?.designs.find(x => x.name === cue.design);
      if (d) cue.partial = designState(d) === "partial";
    }
    else if (id === "cue-align") cue.align = e.target.value;
    else if (id === "cue-partial") cue.partial = e.target.checked;
    else if (id === "cue-seq") cue.sequence = e.target.value;
    else if (id === "cue-step") {
      const step = Number(e.target.value);
      if (!(step >= 0.1 && step <= 5)) { toast("Step: 0.1 to 5 seconds"); renderTimeline(); return; }
      cue.step_s = Math.round(step * 10) / 10;
    }
    await saveShow(cues);
  } else if (e.target.dataset.boardNo) {
    const no = Number(e.target.value);
    if (!Number.isInteger(no) || no < 1) { toast("A board number is a whole number"); renderContent(); return; }
    const answer = await api("/api/boards", { item: ui.item, boards: { [e.target.dataset.boardNo]: no } });
    if (answer?.error) toast(answer.error);
    ui.board = null; refresh();
  } else if (e.target.dataset.label) {
    const card = e.target.closest(".item");
    await api("/api/label", { item: card.dataset.item,
      look: card.querySelector("[data-label=look]").value, model: card.querySelector("[data-label=model]").value });
    refresh();
  } else if (e.target.dataset.assign !== undefined) {
    await api("/api/assign", { item: e.target.dataset.assign, unit: e.target.value || null }); refresh();
  }
});
// Dragging a card by its grip moves everything its unit carries (a top and its
// skirt stay together) to another unit, and what lies between moves along by one -
// like reordering a list of ten. An unassigned item just joins the unit it is
// dropped on. One step for Undo either way.
let dragged = null;
function arrangement(from, to) {
  const units = Object.fromEntries(state.items.filter(i => i.unit).map(i => [i.item, i.unit]));
  if (!state.units.includes(from.unit)) { units[from.item] = to; return units; }
  const order = state.units.map(u => state.items.filter(i => i.unit === u).map(i => i.item));
  const a = state.units.indexOf(from.unit), b = state.units.indexOf(to);
  order.splice(b, 0, order.splice(a, 1)[0]);
  order.forEach((group, n) => group.forEach(key => units[key] = state.units[n]));
  return units;
}
function clearDrop() { document.querySelectorAll(".place.over").forEach(p => p.classList.remove("over", "before", "after")); }
document.addEventListener("dragstart", e => {
  const grip = e.target.closest?.(".grip"), card = grip?.closest(".item");
  if (!card) return;
  const item = itemByKey(card.dataset.item);
  dragged = { item: item.item, unit: item.unit };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", item.item);
  const place = card.closest(".place");
  e.dataTransfer.setDragImage(place || card, 20, 20);
  setTimeout(() => (place || card).classList.add("moving"));
});
document.addEventListener("dragover", e => {
  const place = dragged && e.target.closest?.(".place");
  if (!place) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  clearDrop();
  const a = state.units.indexOf(dragged.unit), b = state.units.indexOf(place.dataset.place);
  if (a === b) return;
  place.classList.add("over"); if (a >= 0) place.classList.add(b < a ? "before" : "after");
});
document.addEventListener("drop", async e => {
  const place = dragged && e.target.closest?.(".place");
  if (!place) return;
  e.preventDefault();
  const from = dragged, to = place.dataset.place; dragged = null; clearDrop();
  if (from.unit === to) return;
  await api("/api/arrange", { units: arrangement(from, to) }); refresh();
});
document.addEventListener("dragend", () => { dragged = null; clearDrop();
  document.querySelectorAll(".moving").forEach(p => p.classList.remove("moving")); });
document.addEventListener("input", e => { if (e.target.id === "ph") { ui.playhead = Number(e.target.value); renderThumbs(); } });
document.addEventListener("mouseover", e => {
  const g = e.target.closest("g[data-k]");
  if (!g || !$("#info")) return;
  const item = state.items.find(i => i.item === ui.item);
  const design = item.designs.find(d => d.name === ui.design);
  const [side, row, col] = g.dataset.k.split("|");
  const board = item.boards.find(b => b.board_no === Number(g.dataset.b));
  const code = design?.colors[g.dataset.k];
  const label = String(g.dataset.b).padStart(3, "0") + "-" + String(g.dataset.s).padStart(2, "0");
  $("#info").innerHTML = `<b>${esc(side)}</b> row ${row} / col ${col} · cable <b>${label}</b>
    (board ${String(g.dataset.b).padStart(3, "0")} = DIP ID <b>${board ? board.dip_id : "?"}</b>, socket P${g.dataset.s})` +
    (design ? ` · colour <b>${code !== undefined ? hex(code) + " " + esc(state.palette[code].name) : "undecided"}</b>` : "");
});

// Into one item: a file belongs to the item its name begins with, so two garments of the
// same shape get the same names from the designer. Imported here, a file is renamed to
// this item (Look22_color_pattern01_grid.csv -> Look22-2_color_pattern01_grid.csv).
async function uploadOwn(item, fileList) {
  const files = [], refused = [];
  for (const f of fileList) {
    const rest = f.name.match(/(_map|_color_.+grid).*\.csv$/i);
    if (rest) files.push({ name: item.item + f.name.slice(rest.index), text: await f.text() });
    else refused.push(f.name);
  }
  const note = refused.length ? `Not a *_map.csv or *_color_NAME_grid.csv: ${refused.join(", ")}` : "";
  if (files.length) upload(files, note); else toast(note);
}
async function upload(fileList, note) {
  const files = [];
  for (const f of fileList) files.push(f.text instanceof Function ? { name: f.name, text: await f.text() } : f);
  if (!files.length) return;
  const result = await api("/api/files", { files });
  const parts = note ? [note] : [];
  if (result.saved?.length) parts.push(`${result.saved.length} file(s) imported`);
  if (result.refused?.length) parts.push("Not imported: " + result.refused.join(" / "));
  toast(parts.join(" · ") || result.error || "");
  refresh();
}
let drag = null;
document.addEventListener("pointerdown", e => {
  const block = e.target.closest(".cue-hold");
  if (!block || e.button !== 0) return;
  const cue = state.show.cues.find(c => c.id === block.dataset.cue);
  if (!cue || cue.at <= 0) return;                  // the preset stays at 0:00
  drag = { cue, block, x: e.clientX, left: block.offsetLeft, track: block.parentElement.getBoundingClientRect(), moved: false };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 5) return;
  drag.moved = true; drag.block.classList.add("dragging");
  drag.block.style.left = (drag.left + dx) + "px";
  const at = Math.max(5, Math.min(state.show.duration, Math.round((drag.cue.at + dx / drag.track.width * state.show.duration) / 5) * 5));
  drag.at = at; drag.block.title = clock(at);
  const label = $("#ph-label"); if (label) label.textContent = clock(at) + " (moving)";
});
let draggedAt = 0;
document.addEventListener("pointerup", async () => {
  const done = drag; drag = null;
  if (!done || !done.moved) return;
  draggedAt = Date.now();                     // the click that follows is part of the drag
  ui.cue = done.cue.id;
  if (done.at === undefined || done.at === done.cue.at) { renderTimeline(); return; }
  ui.playhead = done.at;
  await saveShow(state.show.cues.map(c => c.id === done.cue.id ? { ...c, at: done.at } : c));
});
let depth = 0;
// Files from outside only: a card dragged within the list is not an upload.
const carriesFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", e => { if (!carriesFiles(e)) return; e.preventDefault(); depth++; $("#drop").classList.add("on"); });
addEventListener("dragleave", e => { if (!carriesFiles(e)) return; if (--depth <= 0) { depth = 0; $("#drop").classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); depth = 0; $("#drop").classList.remove("on"); if (carriesFiles(e)) upload(e.dataTransfer.files); });

refresh();
pollFleet();
</script>
