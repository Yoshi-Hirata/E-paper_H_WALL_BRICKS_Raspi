<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-paper Show Conductor</title>
<style>
:root {
  --bg: #f4f4f6; --panel: #ffffff; --ink: #1d1d24; --dim: #6b6b78;
  --line: #dcdce3; --accent: #0a62c9; --ok: #12834a; --err: #c62828;
  --warn: #a15c00; --select: #e6f0fc; --garment: #ececf0; --hold: #dfe7f3;
  /* The ink that reads on an amber SURFACE (--warn as a background), which
     is not --bg or --ink: in light --warn is dark amber and wants white on
     it (5.2:1), in dark it is light amber and wants near-black (10:1). */
  --warn-ink: #ffffff;
  --ph-outline: none;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15161a; --panel: #1e2026; --ink: #ececf1; --dim: #9a9aa8;
    --line: #33353f; --accent: #6db3ff; --ok: #5fd896; --err: #ff7b7b;
    --warn: #ffb860; --select: #243347; --garment: #2a2c35; --hold: #2b3444;
    --warn-ink: #15161a;
    --ph-outline: #fff; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
  background: var(--bg); color: var(--ink); }
header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
/* serve --label (Start Exhibition Conductor.bat passes EXHIBITION): a SEPARATE
   Conductor's name, worn as an amber badge right after the app name so its
   window is never taken for the show's. Made by applyLabel() only when the
   server says so - the show PC's own page has no badge, no title change and
   no tab icon of its own, exactly as before. */
header .app-label { background: var(--warn); color: var(--warn-ink); font-weight: 700;
  font-size: 12px; letter-spacing: .12em; padding: 2px 10px; border-radius: 5px;
  margin-left: -4px; white-space: nowrap; }
/* The OTHER launcher's Conductor is up (the show's 8765 seen from the exhibition's
   8766, or the other way round - /api/conductor's other_conductor): one red line
   in the top bar, made and removed by paintOtherConductor(). An open Conductor
   still acts on the units even when idle, so it must be CLOSED before Upload /
   START here - the note says so until it is gone. */
header .other-conductor { flex-basis: 100%; color: var(--err); font-weight: 600;
  font-size: 13px; margin: -4px 0 0; }
header .ws { color: var(--dim); font-size: 12px; margin-left: auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
button, select, input[type=text], .filebtn { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button, select, .filebtn { cursor: pointer; }
button:hover, .filebtn:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger:hover { border-color: var(--err); color: var(--err); }
button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
/* Play is green and Stop is red - the simulator transport AND the show's own
   ③ START / STOP - so they read at a glance in a dark venue (user, 2026-09-25).
   Disabled ones keep the plain look, so a grey START still means "not yet". */
#tp-play, #show-start:not(:disabled) { background: var(--ok); border-color: var(--ok); color: var(--bg); font-weight: 600; }
#tp-stop, #show-stop:not(:disabled) { background: var(--err); border-color: var(--err); color: var(--bg); font-weight: 600; }
#tp-play:hover, #tp-stop:hover, #show-start:not(:disabled):hover, #show-stop:not(:disabled):hover { filter: brightness(1.12); color: var(--bg); }
.filebtn input { display: none; }
.tabs { display: flex; gap: 0; }
.tabs button { border-radius: 0; margin-left: -1px; padding: 5px 16px; }
.tabs button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.tabs button:last-child { border-radius: 0 6px 6px 0; }
main { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 50px); }
main.wide { grid-template-columns: 1fr; }
main.wide aside { display: none; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; }
aside h2, .card h2 { font-size: 11px; letter-spacing: .1em; color: var(--dim);
  margin: 14px 0 6px; font-weight: 600; }
.card h2 { margin-top: 0; }
.unit { font-size: 12px; color: var(--dim); margin: 12px 0 4px; font-weight: 600; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  margin-bottom: 6px; cursor: pointer; }
.item.sel { background: var(--select); border-color: var(--accent); }
.item .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.meta { color: var(--dim); font-size: 12px; }
.item select { margin-top: 6px; width: 100%; padding: 2px 6px; font-size: 12px; }
.item .name em { font-style: normal; font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
.item .lab { font: inherit; font-weight: 600; color: inherit; background: transparent; min-width: 0;
  border: 1px solid transparent; border-radius: 4px; padding: 1px 4px; }
.item .lab:hover { border-color: var(--line); }
.item .lab:focus { border-color: var(--accent); background: var(--bg); outline: none; }
.item .lab.look { width: 40px; flex: none; }
.item .lab.model { flex: 1; font-weight: 500; font-size: 12px; }
td input.bno { width: 56px; padding: 1px 4px; font: inherit; }
/* The DIP ID: normally the board's rank, typed over when the switches on
   the garment itself were changed. Narrower than a board number (1-60)
   and bold, because it is what the switches are compared against. */
td input.dip { width: 40px; padding: 1px 4px; font: inherit; font-weight: 700; }
td input.dip.byhand { border-color: var(--accent); }
.byhand-tag { font-size: 11px; letter-spacing: .04em; color: var(--accent); }
.byhand-tag button { font: inherit; padding: 0 3px; }
.item .where { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.item .where select { margin-top: 0; flex: 1; min-width: 0; }
.item .where button { font-size: 11px; padding: 2px 8px; flex: none; }
.slot b { font-weight: 600; margin-right: 6px; }
.grip { cursor: grab; color: var(--dim); font-size: 14px; line-height: 1; padding: 0 2px; margin-left: auto;
  user-select: none; flex: none; }
.grip:active { cursor: grabbing; }
.place { border-radius: 8px; padding: 1px 0; }
.place.moving { opacity: .4; }
.place.over { outline: 2px solid var(--accent); outline-offset: 1px; }
.place.over.before { box-shadow: 0 -4px 0 -1px var(--accent); outline: none; }
.place.over.after { box-shadow: 0 4px 0 -1px var(--accent); outline: none; }
.slot { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
  color: var(--dim); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
.dot.none { background: var(--line); }
#content { padding: 14px 18px 40px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 10px; }
.group { display: flex; gap: 4px; align-items: center; min-width: 0; max-width: 100%; }
/* A <select> sizes itself to its longest option (design CSV names are long); cap it so the
   toolbar wraps instead of forcing horizontal page scroll. The native dropdown still shows full text. */
.group select { flex: 1 1 auto; min-width: 0; max-width: 100%; }
.group > span { color: var(--dim); font-size: 12px; margin-right: 4px; }
.group button { border-radius: 0; margin-left: -1px; }
.group button:first-of-type { border-radius: 6px 0 0 6px; margin-left: 0; }
.group button:last-of-type { border-radius: 0 6px 6px 0; }
#stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; overflow-x: auto; }
#stage svg { display: block; margin: 0 auto; }
#info { min-height: 24px; margin: 8px 2px; color: var(--dim); font-size: 13px; }
#info b { color: var(--ink); }
.cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.card + .card { margin-top: 12px; }
.problems { margin: 0; padding-left: 18px; }
.problems li { color: var(--err); margin: 2px 0; font-size: 13px; }
.okline { color: var(--ok); }
.warn { color: var(--warn); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .06em; }
tbody tr.pick { cursor: pointer; } tbody tr.pick:hover { background: var(--select); }
tbody tr.hl { background: var(--select); outline: 1px solid var(--accent); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
  border: 1px solid var(--line); vertical-align: -2px; margin-right: 6px; }
.files { font-size: 12px; color: var(--dim); }
.files span { display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; }
.files button, td button { padding: 0 6px; font-size: 11px; }
#drop { position: fixed; inset: 0; background: rgba(10, 98, 201, .18); border: 4px dashed var(--accent);
  display: none; align-items: center; justify-content: center; font-size: 22px; font-weight: 600;
  color: var(--accent); z-index: 10; pointer-events: none; }
#drop.on { display: flex; }
#toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; display: none; max-width: 60vw; font-size: 13px;
  /* Above everything, the stage monitor (70) included: a toast is how a
     refusal or a failed command says so, and one hidden behind a
     fullscreen board is a message the operator never gets. */
  z-index: 90; }
/* An amber toast: something landed, and part of it needs reading rather
   than the usual glance (Load bundle… keeping a garment's wiring).
   The SURFACE goes amber, never the text: this toast is already inverted
   (--bg text on --ink), and amber text on it reads at 1.45:1 in dark and
   3.23:1 in light - unreadable (review). --warn-ink on --warn is 5.2:1
   light / 10:1 dark. The id sets both, so the class has to be as specific
   to win. */
#toast.warn { background: var(--warn); color: var(--warn-ink); }
.empty { color: var(--dim); padding: 60px 0; text-align: center; }

/* ---- timeline ---- */
/* Every row ends with a "+" column, so the ruler row carries a matching
   empty cell and the playhead wrapper stops short of it by the same amount
   - otherwise the ticks and the red line run past the end of the tracks. */
:root { --tl-add-w: 32px; }
.tl-row { display: grid; grid-template-columns: 150px 1fr var(--tl-add-w); align-items: center;
  min-height: 38px; border-bottom: 1px solid var(--line); }
.tl-add { width: 26px; margin-left: 6px; padding: 0; line-height: 22px; font-size: 16px; font-weight: 600;
  color: var(--dim); text-align: center; }
.tl-add:hover { color: var(--accent); border-color: var(--accent); background: var(--select); }
.tl-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* The empty-track invitation, inside the track it is talking about - the
   one hint line above the tracks is easy to read past. Never clickable
   itself: the click has to land on the track underneath. */
.tl-empty { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 8px;
  color: var(--dim); font-size: 11.5px; pointer-events: none; }
.tl-track.has-ghost .tl-empty { display: none; }
/* The hover ghost: the cue a click right here would create. The
   translucency is on a ::before, not on .cue-ghost itself - `opacity`
   applies to the whole subtree, so a faded parent would drag the label
   down with it and no `opacity:1` on the child could bring it back. */
.cue-ghost { position: absolute; top: 3px; bottom: 3px; min-width: 2px;
  pointer-events: none; z-index: 5; }
.cue-ghost::before { content: ""; position: absolute; inset: 0; border-radius: 3px;
  background: var(--accent); opacity: .32; }
/* On its own panel-coloured chip: the label very often hangs over the cue
   after the empty space, and two lines of 11px text on top of each other
   are unreadable. */
.cue-ghost-label { position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
  margin-left: 5px; white-space: nowrap; font-size: 11px; color: var(--accent);
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
  padding: 0 5px; line-height: 1.5; }
.cue-ghost-label.flip { left: auto; right: 100%; margin-left: 0; margin-right: 5px; }
/* The full-size twin of the empty-track hint, in an empty CUES card. */
.tl-firsthint { color: var(--dim); font-size: 14px; padding: 22px 2px; line-height: 1.9; }
.tl-firsthint b { color: var(--accent); }
/* EDIT CUE's "＋ Add next design after this cue": a link, not a third
   button competing with Delete for the eye. */
.cue-append { margin-top: -2px; }
button.linkish { border: 0; background: none; padding: 0; font-size: 12.5px; color: var(--accent);
  text-decoration: underline; text-underline-offset: 2px; }
button.linkish:hover { filter: brightness(1.15); }
button.linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.tl-name { font-size: 13px; font-weight: 600; padding-right: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-name small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
.tl-track { position: relative; height: 30px; background: var(--bg); border-radius: 4px; cursor: copy; }
.tl-ruler { position: relative; height: 20px; font-size: 11px; color: var(--dim); cursor: ew-resize; touch-action: none; }
.tl-ruler i { position: absolute; top: 0; height: 20px; border-left: 1px solid var(--line); pointer-events: none; }
.tl-ruler span { position: absolute; top: 1px; transform: translateX(3px); pointer-events: none; }
.cue-band { position: absolute; top: 3px; bottom: 3px; border-radius: 3px 0 0 3px; cursor: pointer;
  background: repeating-linear-gradient(135deg, var(--accent) 0 4px, transparent 4px 8px); opacity: .55; }
.cue-hold { position: absolute; top: 3px; bottom: 3px; background: var(--hold); border-radius: 0 3px 3px 0;
  cursor: pointer; overflow: hidden; white-space: nowrap; font-size: 11px; line-height: 24px; padding-left: 5px;
  border-left: 2px solid var(--accent); }
.cue-hold.bad { border-left-color: var(--err); color: var(--err); }
.cue-hold.sel, .cue-band.sel { outline: 2px solid var(--accent); z-index: 2; opacity: 1; }
.cue-hold .chips { display: inline-flex; gap: 1px; margin-right: 5px; vertical-align: -1px; }
.cue-hold .chips b { width: 7px; height: 10px; display: inline-block; border: 1px solid rgba(128,128,128,.5); }
.tl-wrap { position: relative; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--err); pointer-events: none; z-index: 3; }
/* Where the music ends (2026-09-28): an amber dashed line with its words at
   the ruler, and the show left after it hatched as silence. Both are drawn
   only when the music ends inside the show (paintMusicEnd()). */
#music-end { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--warn); pointer-events: none; z-index: 2; }
#music-end span { position: absolute; top: 2px; left: 4px; white-space: nowrap; font-size: 10.5px; font-weight: 600;
  color: var(--warn); background: var(--panel); padding: 0 3px; border-radius: 2px; }
#music-end.flip span { left: auto; right: 6px; }
#music-silence { position: absolute; top: 22px; bottom: 0; right: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 8px); }
#music-silence span { position: absolute; bottom: 2px; left: 6px; font-size: 10.5px; color: var(--dim); }
#music-note:empty { display: none; }
/* The playhead IS the seek control (round: playhead-as-seek, replacing the
   dock's #ph slider, which never lined up with this line - the ruler starts
   150px in for the name column, the old slider spanned the whole dock).
   #ph-head sits only near the ruler's own height, well clear of the track
   rows below (which keep their own click-to-add-cue/drag-to-move-cue
   behaviour) - pointer-events:auto here, none on #playhead itself. A 6px
   side pad each way on top of the 14px triangle clears the "hit area >= 24px"
   ask without widening what is actually drawn. */
#ph-head { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); z-index: 4;
  cursor: ew-resize; pointer-events: auto; padding: 0 6px; touch-action: none; }
/* Only the triangle is centred on the red line; the time label hangs off
   its right side (absolutely positioned) so it never shifts the triangle. */
#ph-head svg { display: block; }
#ph-time { position: absolute; left: 100%; top: -1px; margin-left: 2px; font-size: 10.5px;
  font-variant-numeric: tabular-nums; background: var(--panel); color: var(--err);
  padding: 1px 4px; border-radius: 3px; line-height: 1.3; white-space: nowrap;
  pointer-events: none; }   /* grabbing it still grabs #ph-head, its parent - see grabOffset */
.editor { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.editor label { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.editor input[type=text] { width: 70px; }
.cue-card { display: flex; flex-direction: column; gap: 9px; }
.cue-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.cue-row { display: grid; grid-template-columns: 76px auto 1fr; gap: 4px 12px; align-items: center; }
.cue-row .lbl { font-weight: 600; font-size: 13px; }
.cue-row .ctl { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; }
.cue-row .ctl input[type=text] { width: 64px; }
.cue-row label.rad { flex-wrap: wrap; row-gap: 4px; }
.cue-row .why { color: var(--dim); font-size: 12px; }
.cue-row label.rad { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--ink); font-weight: 400; }
.cue-computed { grid-column: 2 / 4; color: var(--dim); font-size: 13px; margin-left: 0; }
.cue-design { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
/* One row, one cell per LOOK, sized by layoutLooks() to fit without the row
   ever needing its own scrollbar; a LOOK shared by two garments (e.g. a top
   and its skirt on one Radxa) stacks them inside one cell. */
.thumbs { display: flex; flex-wrap: nowrap; gap: 10px; align-items: flex-start; overflow: hidden; }
.look-cell { box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  display: flex; flex-direction: column; align-items: center; overflow: hidden; flex: 0 0 auto; }
.lk-head { font-size: 12px; font-weight: 600; align-self: stretch; }
.lk-head .chg { float: right; color: var(--warn); font-weight: 400; font-size: 11px; }
.lk-head .sub { display: block; font-weight: 400; color: var(--dim); font-size: 10.5px; clear: both;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-item + .lk-item { margin-top: 4px; }
.look-cell svg { display: block; }
input[type=range] { width: 100%; }

/* ---- fleet ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; }
.tile.off { opacity: .55; }
.tile .n { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile .n .ph { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 9px; border: 1px solid var(--line); }
.ph.ready, .ph.armed, .ph.fired { color: var(--ok); border-color: var(--ok) !important; }
.ph.failed { color: var(--err); border-color: var(--err) !important; }
.ph.preparing { color: var(--accent); border-color: var(--accent) !important; }
.tile .row { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); }
.tile .row b { color: var(--ink); font-weight: 500; }
.tile .e { color: var(--err); }
/* The unit's landing check on the last cue (fleet.py's "verify"): amber
   when a re-send put it right, red when even that was not confirmed.
   Nothing at all when the broadcast landed, which is every normal cue.
   The board-list and "restarted since Upload" marks are the same amber:
   the show will run, but that unit is not in the state it should be. */
.tile .vf { font-size: 11px; font-weight: 600; margin-left: 6px; }
.tile .vf.re { color: var(--warn); } .tile .vf.no { color: var(--err); }
/* "pictures cleared": the thing the operator asked for, not a fault - so it
   is a quiet grey, not the green of a thing that went well. */
.tile .vf.ok { color: var(--dim); font-weight: 500; }
/* "Recover bus", beside the stall mark it belongs to: a button the size of
   the words around it, never one that redraws the tile's line height. */
button.small { font-size: 11px; padding: 1px 6px; vertical-align: baseline; }
.tile .mb { color: var(--dim); font-size: 11px; margin-top: 2px; }
.tile .l { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.go { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 10px; }
.go button.big { padding: 7px 16px; font-weight: 600; }
.go button.fire { background: var(--ok); border-color: var(--ok); color: #fff; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 16px; }
.picks label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.picks label span { min-width: 120px; } .picks select { flex: 1; min-width: 0; }
.showbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.showclock { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; min-width: 150px; }
.showclock small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--dim); margin-bottom: 4px; }
.showclock.running small { color: var(--ok); } .showclock.holding small { color: var(--warn); }
/* ③ START's countdown (-0:11 ... -0:01): the board's own 10 s / 3 s colours. */
.showclock.cd-amber { color: var(--warn); } .showclock.cd-red { color: var(--err); }
.showclock .music-end { display: block; font-size: 12px; font-weight: 600; color: var(--dim); margin-top: 6px; max-width: 240px; line-height: 1.3; }
.showclock .music-end.over { color: var(--warn); font-weight: 400; margin-top: 2px; }
.shownext { font-size: 13px; color: var(--dim); min-width: 220px; }
.shownext b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
/* HOLD is an amber SURFACE, so its ink is --warn-ink, never a hardcoded
   white: in dark --warn is light amber (#ffb860) and white on it reads at
   1.71:1 - the one button on this panel nobody may have to squint at
   (review, 2026-09-27). --warn-ink is 5.2:1 light / 10:1 dark. */
.go button.hold { background: var(--warn); border-color: var(--warn);
                  color: var(--warn-ink); }
.go button.stop:hover { border-color: var(--err); color: var(--err); }
/* THE SHOW's own music row. The same green/red as the Timeline's ▶ Play /
   ⏹ Stop, because it is the same audio - one <audio> element serves both. */
.musicbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  margin-top: 8px; padding: 6px 10px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 13px; }
.musicbar label { display: flex; align-items: center; gap: 5px; }
.musicbar .cap { font-weight: 600; letter-spacing: .06em; color: var(--dim); }
.musicbar #show-music-state { font-variant-numeric: tabular-nums; min-width: 130px; color: var(--dim); }
.musicbar #show-music-state.on { color: var(--ok); font-weight: 600; }
.musicbar #show-music-state.off { color: var(--err); font-weight: 600; }
.musicbar #show-music-join { background: var(--ok); border-color: var(--ok); color: var(--bg); font-weight: 600; }
.musicbar #show-music-join:hover { filter: brightness(1.12); }
.musicbar #show-music-mute.muted { background: var(--err); border-color: var(--err); color: var(--bg); font-weight: 600; }
.musicbar #show-music-vol { width: 110px; }
/* The Bluetooth speaker's connection (a speaker Conductor on pulse). */
.musicbar #spk-conn { display: inline-flex; align-items: center; gap: 6px; }
.musicbar #spk-conn-text.ok { color: var(--ok); font-weight: 600; }
.musicbar #spk-conn-text.err { color: var(--err); font-weight: 600; }
.musicbar #spk-conn-text.busy { color: var(--warn); font-weight: 600; }

/* ---- the NOW -> NEXT board (THE SHOW panel, under the big clock) ----
   One header line saying what fires next, then one row per garment. The
   same markup serves the stage monitor (body.stagemon), which only makes
   everything bigger and puts it on black - there is no second board. */
#nownext { margin: 10px 0 4px; }
.nn-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.nn-cap { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--dim); }
.nn-time { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.nn-count { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 96px; }
.nn-count.amber { color: var(--warn); }
.nn-count.red { color: var(--err); animation: nn-pulse .8s ease-in-out infinite; }
@keyframes nn-pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .nn-count.red { animation: none; } }
.nn-what { font-size: 17px; font-weight: 600; flex: 1 1 200px; min-width: 0; }
.nn-fired { font-size: 22px; font-weight: 700; letter-spacing: .1em; color: var(--ok); }
.nn-note { font-size: 13px; color: var(--dim); flex-basis: 100%; }
.nn-follow { font-size: 12px; color: var(--dim); text-align: right; line-height: 1.45;
  flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.nn-follow div { white-space: nowrap; }
.nn-tools { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.nn-rows { display: flex; flex-direction: column; gap: 4px; }
/* minmax(0, …) on every flexible column, so a narrow window squeezes the
   text (which ellipsises) instead of pushing the row off the side of the
   page - a board with a horizontal scrollbar is no use to anyone. */
.nn-row { display: grid; align-items: center; gap: 6px 10px; font-size: 12px;
  grid-template-columns: 124px minmax(0, 1.2fr) 58px minmax(0, 1.2fr) 96px minmax(0, 1.4fr);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
.nn-row.off { opacity: .55; }
.nn-row.soon { border-color: var(--warn); }
.nn-row.now { border-color: var(--err); }
.nn-who b { font-size: 14px; display: block; }
.nn-who small { color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nn-cell { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; }
/* A fixed box the garment is fitted into, rather than a size on the SVG:
   renderGarment() writes its own inline width/max-width (boardThumb strips
   them), and a viewBox told to fill a box scales itself to fit whatever
   shape the garment is. */
.nn-thumb { flex: 0 0 auto; background: var(--garment); border-radius: 4px;
  width: 92px; height: 46px; padding: 2px; display: flex; align-items: center; justify-content: center; }
.nn-thumb svg { display: block; width: 100%; height: 100%; }
.nn-txt { min-width: 0; }
.nn-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.nn-when { color: var(--dim); font-variant-numeric: tabular-nums; }
.nn-when .c.amber { color: var(--warn); font-weight: 700; }
.nn-when .c.red { color: var(--err); font-weight: 700; }
.nn-prog { height: 4px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
.nn-prog i { display: block; height: 100%; background: var(--accent); }
.nn-arr { text-align: center; color: var(--dim); }
.nn-arr b { display: block; font-size: 19px; color: var(--ink); line-height: 1.1; }
.nn-state .ok { color: var(--ok); } .nn-state .warnx { color: var(--warn); } .nn-state .err { color: var(--err); }
/* The unit's own marks (verifyMark, stallMark) ride on this cell as well as
   on the tile, and were inheriting the row's grey there: amber and red mean
   the same thing in both places or they mean nothing (2026-09-28). */
.nn-state .vf { font-weight: 600; margin-left: 6px; }
.nn-state .vf.re { color: var(--warn); } .nn-state .vf.no { color: var(--err); }
/* "press Recover bus (or reboot these Radxas), then Upload", under ③ START
   and in the dialog. Only
   there when it has something to say: an empty warning line still costs its
   own margin, and both panels are tight. */
#show-degraded, #write-degraded { margin-top: 6px; }
#show-degraded:empty, #write-degraded:empty { display: none; }
.nn-vit { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nn-vit.amber { color: var(--warn); } .nn-vit.red { color: var(--err); font-weight: 600; }
.nn-bags { margin-top: 4px; }
.nn-bags > button { font-size: 12px; }
.nn-empty { color: var(--dim); font-size: 12px; }
/* The stage monitor: the same board, fullscreen, on black. Requested via the
   Fullscreen API; when the browser refuses (or ESC leaves it) the fixed
   overlay below is the whole feature on its own. */
#nn-stage { position: fixed; inset: 0; z-index: 70; background: #0b0b0e; color: #f2f2f6;
  overflow: auto; padding: 18px 22px; display: none; }
body.stagemon #nn-stage { display: block; }
body.stagemon { overflow: hidden; }
#nn-stage #nownext { margin: 0; }
#nn-stage .nn-head, #nn-stage .nn-row { border-color: #3a3a46; }
#nn-stage .nn-cap, #nn-stage .nn-who small, #nn-stage .nn-when, #nn-stage .nn-vit,
#nn-stage .nn-arr, #nn-stage .nn-note, #nn-stage .nn-follow { color: #a6a6b6; }
#nn-stage .nn-time { font-size: 40px; } #nn-stage .nn-count { font-size: 54px; min-width: 150px; }
#nn-stage .nn-what { font-size: 26px; } #nn-stage .nn-fired { font-size: 34px; }
#nn-stage .nn-row { font-size: 16px; grid-template-columns: 180px minmax(0, 1.3fr) 74px minmax(0, 1.3fr) 118px minmax(0, 1.5fr); }
#nn-stage .nn-who b { font-size: 20px; }
#nn-stage .nn-thumb { width: 128px; height: 64px; }
#nn-stage .nn-follow { font-size: 15px; }
body.busy .go button, body.busy #show-seek-wrap input,
body.busy .dlg button, body.busy .dlg input { opacity: .45; pointer-events: none; }
body.busy #write-back { pointer-events: none; }
.card h2 + .sub { margin: -2px 0 8px; }
.cue-hold, .cue-band { min-width: 7px; }
.cue-hold { cursor: grab; } .cue-hold.dragging { cursor: grabbing; opacity: .8; z-index: 4; outline: 2px dashed var(--accent); }

/* ---- designs list (replaces the DESIGNS OF THIS ITEM table: see round 3 plan §1.1) ---- */
.dsg-list { display: flex; flex-direction: column; gap: 6px; }
.dsg { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.dsg:hover { background: var(--select); }
.dsg.hl { background: var(--select); outline: 1px solid var(--accent); }
.dsg-main { flex: 1 1 200px; min-width: 0; }
.dsg-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dsg-top .use { color: var(--dim); font-size: 12px; }
.dsg-file { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dsg-tr { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; white-space: nowrap; }
.dsg-tr select { width: 158px; font-size: 12px; }
.dsg-tr input[type=text] { width: 44px; }

/* ---- show seek bar (Units tab, manual gate: round 3 plan §1.2) ---- */
.seek-wrap { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin: 10px 0; }
.seek-wrap.on { border: 2px solid var(--warn); padding: 8px 10px; }
.seek-cap { color: var(--warn); font-weight: 700; font-size: 11px; letter-spacing: .08em; margin-bottom: 5px; }
.seek-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.seek-head label { display: flex; align-items: center; gap: 6px; }
.seek-bar { display: flex; align-items: center; gap: 8px; }
.seek-bar input[type=range] { flex: 1; }
.seek-bar span { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.go button.warnbtn { background: var(--warn); border-color: var(--warn); color: var(--bg); }

/* ---- live LOOK row (Units tab: round 3 plan §1.3) ---- */
.thumbs.small { height: 120px; }
.thumbs.small .lk-head { font-size: 11px; }
.thumbs.small .lk-head .sub { font-size: 9.5px; }
.lk-head .chg.err { color: var(--err); }
/* Pin the head to exactly what layoutLooks() budgets (view.head = 30) so a long
   name/unit/chip line can never grow the cell taller than the fixed 120 px row -
   it ellipsises instead of wrapping, which used to push the garment SVG past
   .thumbs{overflow:hidden} and clip it (fix round: LOOK row head pinned). */
.thumbs.small .lk-head { height: 30px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.thumbs.small .lk-head .chg { float: none; margin-left: 6px; }

/* ---- "Write to units…": the one place the timeline reaches the units
   (plan_write_to_units.md, 2026-09-25). One dialog, two choices - Upload
   for the show this PC drives, or Save on the units as a standalone demo -
   plus the chips that say, on both tabs, what the units actually hold. */
button.primarybtn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primarybtn:hover { border-color: var(--accent); filter: brightness(1.08); }
button.primarybtn:disabled { filter: none; }
.unit-chips { display: inline-flex; flex-wrap: nowrap; gap: 4px 6px; vertical-align: middle;
  min-width: 0; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
  border-radius: 10px; padding: 1px 9px; font-size: 11.5px; color: var(--dim);
  white-space: nowrap; letter-spacing: 0; text-transform: none; font-weight: 400; }
.chip b { color: var(--ink); font-weight: 600; }
.chip { overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
/* Below a wide desktop the verdict word goes: the colour still says it,
   and the whole sentence is in the chip's own title. */
@media (max-width: 1280px) { .chip .verdict { display: none; } }
.chip.ok { border-color: var(--ok); color: var(--ok); } .chip.ok b { color: var(--ok); }
.chip.warn { border-color: var(--warn); color: var(--warn); } .chip.warn b { color: var(--warn); }
#write-back { position: fixed; inset: 0; z-index: 9; background: rgba(12, 14, 20, .5);
  display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .3); width: min(900px, 100%); padding: 14px 18px 16px; }
.dlg-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dlg-head h2 { margin: 0; font-size: 13px; letter-spacing: .1em; color: var(--dim); }
.dlg-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
@media (max-width: 820px) { .dlg-choices { grid-template-columns: 1fr; } }
.choice { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; }
.choice.off { background: var(--bg); }
.choice.off h3, .choice.off .what { opacity: .6; }
.choice h3 { margin: 0; font-size: 17px; font-weight: 600; }
.choice .what { font-size: 13.5px; }
.choice .when { font-size: 12px; color: var(--dim); }
.choice .why { font-size: 12.5px; color: var(--err); }
.choice .note { font-size: 12.5px; color: var(--warn); }
.choice .note:empty { display: none; }
/* "Type a name first" is not a refusal, it is the next thing to do. */
.choice .why.soft { color: var(--dim); }
.choice .why:empty, .dlg-units:empty { display: none; }
.choice .go { margin-top: 0; }
.choice button.big { align-self: flex-start; margin-top: auto; }
.dlg-units { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--dim); }
.dlg-units span.u { display: inline-flex; align-items: center; gap: 5px; }
.dlg-units span.u.gone { color: var(--warn); }
.dlg-units span.u .rev { color: var(--dim); }
.dlg-units span.u .rev.old { color: var(--warn); }
/* The units a one-LOOK write is NOT going to: they are why START will
   refuse afterwards, so they stay on screen rather than disappearing. */
.dlg-units.left { font-size: 11.5px; opacity: .9; }
.dlg-units.left .lbl { color: var(--dim); }
/* "Which LOOKs": the radio group above the two choices. One row per LOOK
   the timeline reaches, in LOOK order - the operator points at the look
   they are checking, not at a unit name they would have to look up. */
.dlg-only { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 9px; }
.dlg-only .only-h { font-size: 11px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.dlg-only .only-rows { display: grid; gap: 1px; margin-top: 4px; max-height: 176px; overflow-y: auto; }
.dlg-only label { display: flex; align-items: baseline; gap: 7px; font-size: 13px;
  padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.dlg-only label:hover { background: var(--bg); }
.dlg-only label.off { cursor: default; color: var(--dim); }
.dlg-only label.off:hover { background: none; }
.dlg-only input { margin: 0; flex: none; align-self: center; }
.dlg-only .who { color: var(--dim); }
.dlg-only .none { color: var(--warn); }
/* "After the show - clear the pictures": under the two destinations, in the
   same box style but full width, because it is the one thing in here that
   takes something away rather than writing it. */
.dlg-clear { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px;
             padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.dlg-clear.off { background: var(--bg); }
.dlg-clear.off h3, .dlg-clear.off .what { opacity: .6; }
.dlg-clear h3 { margin: 0; font-size: 15px; font-weight: 600; }
.dlg-clear .what { font-size: 13px; }
.dlg-clear .why { font-size: 12.5px; color: var(--err); }
.dlg-clear .why:empty { display: none; }
.dlg-clear button.big { align-self: flex-start; }
.dlg-result { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
.dlg-result h3 { margin: 0 0 4px; font-size: 13px; }
.dlg-result .fail { color: var(--err); }
.dlg-result .warn { color: var(--warn); margin-top: 6px; }
.dlg-result .lcd { margin-top: 8px; border: 1px solid var(--ok); border-radius: 8px;
  padding: 8px 10px; font-size: 13px; }
#write-progress { margin-top: 6px; }
#write-progress .row { display: flex; justify-content: space-between; gap: 10px; max-width: 420px; color: var(--dim); }
#write-progress .row b { color: var(--ink); font-weight: 500; }
#write-name { text-transform: uppercase; width: 170px; }

/* ---- Timeline: EDIT CUE beside the tracks + a bottom dock for THE LOOKS AT
   (plan_timeline_layout.md, 2026-09-24) - so an open cue editor can never
   push the looks row off screen. Below 1400 px the editor still stacks under
   the tracks (single column); the dock is fixed either way. */
#tl-editing { display: flex; flex-direction: column; gap: 12px; }
#tl-editing .tl-left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 1400px) {
  #tl-editing { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; align-items: start; }
  /* Sticks while the tracks/cues scroll past it; capped so it can grow no
     taller than the gap above the dock, with its own scrollbar past that -
     never behind the fixed dock. Both custom properties are measured, not
     guessed (see syncDockSpacing()); the fallbacks only cover the first
     paint. --tl-editor-top used to be a flat 24px (top:12px + a little
     slack), which only holds once the card is actually stuck - before that,
     still in flow below the toolbar/header, its real top is much further
     down, so the card could grow past the dock before it ever reached
     top:12 (fix round finding 14). */
  #tl-editor-card { position: sticky; top: 12px;
    max-height: calc(100vh - var(--tl-editor-top, 220px) - var(--tl-dock-h, 150px));
    overflow-y: auto; }
  /* In the 400px side column the explanation goes UNDER the controls,
     not squeezed beside them into a one-word-per-line ribbon. */
  #tl-editor-card .cue-row { grid-template-columns: 76px minmax(0, 1fr); }
  #tl-editor-card .cue-row .why { grid-column: 2; margin-top: -2px; }
  #tl-editor-card .cue-computed { grid-column: 2; }
}
.card-head-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
.card-head-toggle h2 { margin: 0; }
.card-head-toggle:hover h2 { color: var(--accent); }
.card-head-toggle .chev { border: 0; background: transparent; color: var(--dim); font-size: 13px;
  padding: 0 2px; line-height: 1; }
.card-head-toggle .chev:hover { color: var(--accent); }

/* The dock: always on screen while the Timeline tab is open, like a DAW
   transport - EDIT CUE can never push it away. Simulator view instead reuses
   the old in-flow "THE LOOKS AT" card (view.fill fills the window), since
   the tracks/editor/cues are hidden then and there is nothing to dock over. */
#tl-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--panel); border-top: 1px solid var(--line); padding: 6px 18px; }
.tl-dock-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tl-dock-title { font-size: 11px; letter-spacing: .08em; color: var(--dim); font-weight: 600; white-space: nowrap; }
.tl-dock-title b { font-size: 13px; letter-spacing: normal; color: var(--ink); font-weight: 600;
  font-variant-numeric: tabular-nums; margin-left: 6px; }
#tl-dock .thumbs { margin-top: 6px; }
#tl-dock-mode { white-space: nowrap; }
/* A 6px grab strip across the very top of the dock, inside its own top
   padding so it never steals height from the layout the operator sees. */
#tl-dock-handle { position: absolute; left: 0; right: 0; top: 0; height: 6px; cursor: ns-resize;
  display: flex; align-items: center; justify-content: center; touch-action: none; }
#tl-dock-handle::before { content: ""; width: 44px; height: 3px; border-radius: 2px;
  background: var(--line); transition: background .15s, width .15s; }
#tl-dock-handle:hover::before, #tl-dock-handle.dragging::before { background: var(--accent); width: 64px; }
</style>
</head>
<body>
<header>
  <h1>E-PAPER SHOW CONDUCTOR</h1>
  <div class="tabs">
    <button data-tab="items">Designs</button><button data-tab="timeline">Timeline</button><button data-tab="fleet">Units</button>
  </div>
  <div class="tabs">
    <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo ↷</button>
  </div>
  <label class="filebtn" tabindex="0" role="button">Add CSV<input id="pick" type="file" accept=".csv" multiple></label>
  <span class="meta">or drop CSV files anywhere on the page</span>
  <span class="ws" id="ws"></span>
</header>
<main id="main">
  <aside>
    <h2>ITEMS (LOOKS / BAGS)</h2>
    <div id="items"></div>
    <div id="orphans"></div>
  </aside>
  <div id="content"></div>
</main>
<div id="drop">Drop the CSV files here</div>
<div id="toast"></div>
<!-- "Write to units…" lives outside #content: it must survive the render of
     whichever tab it was opened from (and be reachable from both). -->
<div id="write-host"></div>
<!-- The stage monitor: the NOW -> NEXT board on its own, fullscreen, on
     black. Outside #content for the same reason as the dialog above - the
     board node is MOVED in here and back, so there is never a second board
     to keep in step (see placeBoard()). -->
<div id="nn-stage"></div>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// same value, fires no input/change at all - ui.seekDrag would otherwise
// stay set forever, freezing the live LOOK row at the drag position and (via
// computeSeekState) leaving the bar readable-but-wrongly-enabled the next
// time Manual gets unticked (fix round finding 2, BLOCKER). Deferred one
// tick so a "change" that *does* fire on this same release - which sets
// ui.seekTimer - wins the race and is left alone.
function releaseSeekIfIdle() {
  if (ui.seekDrag === null) return;
  setTimeout(() => { if (ui.seekDrag !== null && ui.seekTimer === null) { ui.seekDrag = null; paintSeek(); } }, 0);
}
document.addEventListener("input", e => {
  if (e.target.id === "show-seek") { previewSeek(Number(e.target.value)); return; }
  // Volume follows the thumb as it moves (on "change" the room would only
  // hear it once the operator let go); it is the same element the Timeline's
  // preview plays through, so there is one volume, not two.
  if (e.target.id === "show-music-vol") {
    const v = Number(e.target.value);
    if (v >= 0 && v <= 100) { player.volume = v / 100; saveMusicAudioPrefs(); paintShowMusic(); }
    return;
  }
  if (e.target.id === "write-name") {
    // The field keeps whatever case was typed (CSS shows it upper-cased; the
    // value sent on Write is upper-cased then) - rewriting .value here on
    // every keystroke would fight the caret while typing in the middle.
    ui.demoName = e.target.value;
    const counter = $("#write-name-count");
    if (counter) counter.textContent = `${ui.demoName.trim().length}/${DEMO_NAME_MAX}`;
    const s = writeState();
    const btn = $("#write-demo"), why = $("#write-demo-why");
    if (btn) btn.disabled = !!(s.demoWhy || s.nameWhy);
    if (why) {
      why.textContent = s.demoWhy || s.nameWhy || "";
      why.classList.toggle("soft", !(s.demoWhy || (s.nameWhy && s.name)));
    }
    return;
  }
  if (e.target.id !== "ph") return;
  const t = Number(e.target.value);
  ui.playhead = t;
  if (ui.playing) {                 // dragging the scrubber while playing seeks, not stops
    if (playerUrl) { player.currentTime = t; previewSeeked(t); }   // "seeked" clears `seeking` once the async seek lands
    else { ui.anchor = performance.now(); ui.startT = t; seeking = false; }
  } else {
    seeking = false;
  }
  updatePlayheadDom(t);
  updateThumbColors(t, THUMBS.timeline);
});
// The playhead IS the seek control (round: playhead is the seek control) -
// its own head, or a press anywhere on the ruler, scrubs by mapping pointer
// x through the same px -> seconds the ruler's old click-to-seek used. The
// dock's #ph slider is gone everywhere this is visible (its position never
// lined up with the red line, which starts 150px in for the name column)
// and lives on only in Simulator view, where there is nothing to misalign
// with - see looksHtml in renderTimeline().
function rulerSeconds(clientX) {
  const ruler = $("#ruler"), D = state.show.duration;
  if (!ruler) return ui.playhead;
  const box = ruler.getBoundingClientRect();
  return Math.max(0, Math.min(D, (clientX - box.left) / box.width * D));
}
// The inverse of rulerSeconds: where t sits on the ruler right now, in
// clientX pixels - used to find the offset between the pointer and the
// triangle at grab time (see #ph-head's pointerdown below).
function rulerX(t) {
  const ruler = $("#ruler"), D = state.show.duration;
  if (!ruler || !D) return 0;
  const box = ruler.getBoundingClientRect();
  return box.left + (t / D) * box.width;
}
// No innerHTML, no layout read/write beyond what updatePlayheadDom/
// updateThumbColors already do per playback frame - safe to call on every
// pointermove.
function scrubTo(t) {
  ui.playhead = t;
  updatePlayheadDom(t);
  updateThumbColors(t, THUMBS.timeline);
}
let phDrag = null;
function endPhDrag() {
  phDrag = null;
  seeking = false;
}
document.addEventListener("pointerdown", e => {
  const head = e.target.closest("#ph-head");
  const target = head || e.target.closest("#ruler");
  if (!target || e.button !== 0) return;
  e.preventDefault();
  seeking = true;                    // tick() must not fight this drag - see its own guard
  // Grabbing the head anywhere inside it - including the time label hanging
  // off its right side, inside the same pointer-events:auto box - keeps
  // whatever offset the pointer grabbed it at, so the triangle follows the
  // hand instead of snapping under the cursor (fix round finding 8). A press
  // on the ruler itself still jumps straight to that spot, as before.
  const grabOffset = head ? e.clientX - rulerX(ui.playhead) : 0;
  phDrag = { lastSeekAt: 0, grabOffset };
  scrubTo(rulerSeconds(e.clientX - grabOffset));
  try { target.setPointerCapture(e.pointerId); } catch {}
});
document.addEventListener("pointermove", e => {
  if (!phDrag) return;
  const t = rulerSeconds(e.clientX - phDrag.grabOffset);
  scrubTo(t);
  // Seeking an <audio> element is not free - throttle it while dragging (a
  // "scrub preview", playing or not) and do the exact final seek on release.
  // ...and not at all while THE SHOW owns the element: scrubbing the preview's
  // playhead must never drag the music the room is listening to (the sync
  // layer would only haul it back a tick later anyway).
  const now = performance.now();
  if (playerUrl && !showMusicOwns() && now - phDrag.lastSeekAt >= 250) { phDrag.lastSeekAt = now; player.currentTime = t; }
});
document.addEventListener("pointerup", () => {
  if (!phDrag) return;
  phDrag = null;
  const t = ui.playhead;
  if (playerUrl && !showMusicOwns()) { player.currentTime = t; previewSeeked(t); }   // exact final seek; the "seeked" listener clears `seeking`
  else {
    // No music: play (if running) from the dropped spot via the virtual
    // clock tick() reads - the old slider's own resume behaviour.
    if (ui.playing) { ui.anchor = performance.now(); ui.startT = t; }
    seeking = false;
  }
});
// A cancelled pointer (e.g. a touch interrupted by a system gesture) left
// phDrag set and seeking true forever - every later mouse move kept
// scrubbing, and tick() stayed parked waiting for a "seeked" that would
// never come (fix round finding 4).
document.addEventListener("pointercancel", endPhDrag);
window.addEventListener("blur", endPhDrag);
// Space toggles play/pause, except while typing, over a control that owns the
// key, or off the Timeline tab (there is nothing to play/pause to look at).
// A <label class="filebtn"> IS the button its name says it is - the
// <input type=file> inside it is display:none - so it carries tabindex and
// role="button", and has to answer Enter and Space the way the <button>s
// beside it do. Without this the only way to reach "Add CSV", "Load
// show…" or "Load music" was a mouse.
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " " && e.code !== "Space") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const btn = e.target.closest?.("label.filebtn");
  const input = btn && btn.querySelector("input[type=file]");
  if (!input) return;
  e.preventDefault();          // Space must not also scroll, or start the show
  input.click();
});
document.addEventListener("keydown", e => {
  if (e.key !== " " && e.code !== "Space") return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (["input", "select", "textarea", "button"].includes(tag)) return;
  if (e.target.closest?.("label.filebtn")) return;   // that label IS a button
  if (ui.tab !== "timeline") return;
  e.preventDefault();
  togglePlayback();
});
// Arrow keys nudge the playhead (1 s, 5 s with Shift); Home jumps to 0:00 -
// same guard as Space, so typing in a field never gets hijacked. A focused
// radio/checkbox (or a button) has nothing of its own worth ←/→ for other
// than moving a radio's selection within its group (which fires change ->
// saveShow -> a silent cue edit) - steal the keys back there too, but leave
// text/number inputs, selects and textareas alone (fix round finding 6).
document.addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight", "Home"].includes(e.key)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  const type = (e.target.type || "").toLowerCase();
  const stealsArrows = tag === "select" || tag === "textarea"
    || (tag === "input" && !["radio", "checkbox"].includes(type));
  if (stealsArrows) return;
  if (ui.tab !== "timeline" || !state) return;
  e.preventDefault();
  const D = state.show.duration;
  const t = e.key === "Home" ? 0
    : Math.max(0, Math.min(D, ui.playhead + (e.shiftKey ? 5 : 1) * (e.key === "ArrowLeft" ? -1 : 1)));
  scrubTo(t);
  // Set before the seek, not after - otherwise tick() can yank the playhead
  // back to the pre-seek position in the frame between assigning
  // currentTime and the "seeked" event landing (fix round finding 9).
  if (playerUrl) { seeking = true; player.currentTime = t; previewSeeked(t); }
  else if (ui.playing) { ui.anchor = performance.now(); ui.startT = t; }
});
document.addEventListener("mouseover", e => {
  const g = e.target.closest("g[data-k]");
  if (!g || !$("#info")) return;
  const item = state.items.find(i => i.item === ui.item);
  const design = item.designs.find(d => d.name === ui.design);
  const [side, row, col] = g.dataset.k.split("|");
  const board = item.boards.find(b => b.board_no === Number(g.dataset.b));
  const code = design?.colors[g.dataset.k];
  const label = String(g.dataset.b).padStart(3, "0") + "-" + String(g.dataset.s).padStart(2, "0");
  $("#info").innerHTML = `<b>${esc(side)}</b> row ${row} / col ${col} · cable <b>${label}</b>
    (board ${String(g.dataset.b).padStart(3, "0")} = DIP ID <b>${board ? board.dip_id : "?"}</b>, socket P${g.dataset.s})` +
    (design ? ` · colour <b>${code !== undefined ? hex(code) + " " + esc(state.palette[code].name) : "undecided"}</b>` : "");
});

// Into one item: a file belongs to the item its name begins with, so two garments of the
// same shape get the same names from the designer. Imported here, a file is renamed to
// this item (Look22_color_pattern01_grid.csv -> Look22-2_color_pattern01_grid.csv).
// The renaming is the SERVER's now (Workspace.intake's `item`), because
// two of its rules cannot be applied here: numbering a name this garment
// already holds needs to know what is on disk, and refusing another
// garment's *_map.csv needs to know which garments exist. Renaming one
// here used to replace this garment's wiring with another garment's,
// throw the original away, and report it as a success - the hundreds of
// CHECK problems that followed were the only hint.
async function uploadOwn(item, fileList) {
  await upload(fileList, "", item.item);
}
// A refusal/rename list short enough to read in a toast - the simulator's
// briefly() (designer-app.js): a dropped folder can hold a hundred files,
// and nobody wants them named one by one across three lines of the screen.
function briefly(entries, format, limit) {
  const n = limit || 3;
  const shown = entries.slice(0, n).map(format).join("; ");
  return entries.length > n ? `${shown} +${entries.length - n} more` : shown;
}
// Every file that was picked is accounted for out loud. The server never
// overwrites (Workspace.intake): a second design of a name already here is
// numbered "-2" and says so, the same bytes again are "already there", and
// a second wiring file is refused - all three are things the operator has
// to see, not quietly different outcomes of the same drop.
// What a Mac does to a file name on the way here, and what it puts
// beside a file in a zip - conductor/look.py's mac_safe_name() /
// is_mac_metadata(), which the server applies to whatever gets sent.
// They are here as well because the check that matters happens BEFORE
// the bytes are read, and only the page has the bytes to not read.
const macSafeName = name => {
  let n = String(name);
  try { n = n.normalize("NFC"); } catch {}
  return /\.csv\.txt$/i.test(n) ? n.replace(/\.txt$/i, "") : n;
};
const isMacMetadata = name => {
  let n = String(name);
  try { n = n.normalize("NFC"); } catch {}
  return n.split(/[\\/]/).some(p => p.startsWith("._") || p === ".DS_Store"
                                    || p.toUpperCase() === "__MACOSX");
};
// Read the picked File objects, refusing what cannot be a CSV BY NAME
// first. Never after: a dropped folder can hold a 2 GB video, and
// reading one as text to find out it is not a CSV is the one mistake
// this must not make (the simulator's addFilesFromBlobs, same rule).
// Anything already shaped {name, text} is passed through - uploadOwn()
// and Load bundle… hand over text they have their own reasons for.
async function readPickedFiles(fileList, refused) {
  const files = [], metadata = [];
  for (const f of fileList) {
    if (!(f.text instanceof Function)) { files.push(f); continue; }
    if (isMacMetadata(f.name)) { metadata.push(String(f.name)); continue; }
    if (!/\.csv$/i.test(macSafeName(f.name))) { refused.push(`${f.name}: not a .csv file`); continue; }
    try { files.push({ name: f.name, text: await f.text() }); }
    catch { refused.push(`${f.name}: could not be read`); }
  }
  if (metadata.length) console.info("set aside, macOS metadata:", metadata);
  return files;
}
// A dropped FOLDER, and folders inside it: File.name never carries a
// path, so this flattens the entry tree first. Dropping a folder whose
// CSVs sit one level down used to do nothing at all, which looks exactly
// like dropping a folder the page rejected.
function traverseEntry(entry) {
  return new Promise(resolve => {
    if (entry.isFile) entry.file(file => resolve([file]), () => resolve([]));
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readMore = () => reader.readEntries(async entries => {
        if (!entries.length) { const nested = await Promise.all(all.map(traverseEntry)); resolve(nested.flat()); return; }
        all.push(...entries); readMore();
      }, () => resolve([]));
      readMore();
    } else resolve([]);
  });
}
// Called straight from the drop handler and synchronous up to its first
// await: a DataTransfer's items are dead the moment the handler returns,
// so the entries must be taken out of it now, not after a read.
async function filesFromDataTransfer(dt) {
  if (dt.items && dt.items[0] && dt.items[0].webkitGetAsEntry) {
    const entries = [...dt.items].map(i => i.webkitGetAsEntry()).filter(Boolean);
    const groups = await Promise.all(entries.map(traverseEntry));
    const flat = groups.flat();
    // webkitGetAsEntry() exists on browsers that hand back nothing for a
    // drag they still put in dt.files (Safari, and some drags on Chrome).
    // Falling through to dt.files is the difference between "your files
    // arrived" and a drop that silently did nothing at all.
    if (flat.length) return flat;
  }
  return [...dt.files];
}
// Every file that was picked is accounted for out loud. The server never
// overwrites (Workspace.intake): a second design of a name already here is
// numbered "-2" and says so, the same bytes again are "already there", and
// a second wiring file is refused - all three are things the operator has
// to see, not quietly different outcomes of the same drop.
async function upload(fileList, note, item) {
  const parts = note ? [note] : [];
  const refusedHere = [];
  const files = await readPickedFiles(fileList, refusedHere);
  const result = files.length
    ? await api("/api/files", item ? { files, item } : { files })
    : { saved: [] };
  // Lists, not maps keyed by the picked name: a folder drop can hold two
  // "pattern.csv" one directory apart, and a map would report one of them.
  const renamed = result.renamed || [];
  const skipped = result.skipped || [];
  const refused = refusedHere.concat(result.refused || []);
  const onto = item ? " to " + (itemFull(itemByKey(item)) || item) : "";
  if (result.saved?.length) parts.push(`${result.saved.length} file(s) imported${onto}`);
  if (renamed.length) parts.push("saved as " + briefly(renamed, r => `${r.from} → ${r.to}`));
  if (skipped.length) parts.push(`${skipped.length} already there: `
    + briefly(skipped, r => r.from === r.as ? r.from : `${r.from} (as ${r.as})`));
  if (refused.length) parts.push(`${refused.length} refused: ` + briefly(refused, x => x));
  toast(parts.join(" · ") || result.error || "No CSV files found");
  if (files.length) refresh();
}
// ---- the hover ghost --------------------------------------------------
// "Click an empty spot on a track" was true and invisible: nothing on the
// screen said a click would do anything until it already had. Moving the
// pointer over empty track space now draws the cue that click would create -
// at the same snapped moment, showing the same design - so the gesture is
// discovered by hovering rather than by reading the hint line.
//
// One ghost at a time, pointer-events:none (so it can never become e.target
// and confuse the checks under it), and it lives inside the track's own
// innerHTML, which every renderTimeline() replaces wholesale.
function clearGhost() {
  document.querySelectorAll(".cue-ghost").forEach(g => g.remove());
  document.querySelectorAll(".tl-track.has-ghost").forEach(t => t.classList.remove("has-ghost"));
}
function moveGhost(e) {
  const track = e.target.closest?.(".tl-track");
  // Never while a cue is being dragged or the playhead scrubbed (both are
  // pointer gestures that pass right over empty track space), and never on
  // top of an existing cue, where a click selects rather than places.
  if (!track || drag || seeking || e.target.closest(".cue-hold, .cue-band")) { clearGhost(); return; }
  const item = state.items.find(i => i.item === track.dataset.track);
  const design = item && nextUnusedDesign(item);   // exactly what the click would place
  if (!design) { clearGhost(); return; }
  const D = state.show.duration;
  const t = trackTimeAt(track, e.clientX, e.shiftKey);
  let ghost = track.querySelector(".cue-ghost");
  if (!ghost) {
    clearGhost();
    ghost = document.createElement("div");
    ghost.className = "cue-ghost";
    ghost.appendChild(document.createElement("span")).className = "cue-ghost-label";
    track.appendChild(ghost);
    track.classList.add("has-ghost");
  }
  ghost.style.left = (100 * t / D).toFixed(3) + "%";
  ghost.style.width = (100 * Math.min(Math.max(0, D - t), state.show.refresh_s) / D).toFixed(3) + "%";
  ghost.dataset.at = String(t);
  const label = ghost.firstChild;
  label.textContent = `+ ${designLabel(design)} at ${clock(t)}`;
  // The label hangs off the right of the band and flips to its left when it
  // would otherwise run past the end of the track. MEASURED, not guessed
  // from t: a design name is anywhere from 6 to 40 characters, so a fixed
  // "past 80% of the show" threshold flips too early for a short name and
  // lets a long one run tens of pixels past the card.
  label.classList.remove("flip");
  if (label.getBoundingClientRect().right > track.getBoundingClientRect().right) label.classList.add("flip");
}
document.addEventListener("pointerleave", clearGhost);

let drag = null;
document.addEventListener("pointerdown", e => {
  clearGhost();
  const block = e.target.closest(".cue-hold");
  if (!block || e.button !== 0) return;
  const cue = state.show.cues.find(c => c.id === block.dataset.cue);
  if (!cue || cue.at <= 0) return;                  // the preset stays at 0:00
  drag = { cue, block, x: e.clientX, left: block.offsetLeft, track: block.parentElement.getBoundingClientRect(), moved: false };
});
document.addEventListener("pointermove", e => {
  if (!drag) { moveGhost(e); return; }
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 5) return;
  drag.moved = true; drag.block.classList.add("dragging");
  drag.block.style.left = (drag.left + dx) + "px";
  // A whole second, 5 with Shift - the same steps the ruler's own arrow keys
  // use. A fixed 5 s made "one second later than the cue above" impossible
  // to express by hand at all.
  const snap = e.shiftKey ? DRAG_SNAP_SHIFT_S : DRAG_SNAP_S;
  const at = Math.max(DRAG_SNAP_S, Math.min(state.show.duration,
    Math.round((drag.cue.at + dx / drag.track.width * state.show.duration) / snap) * snap));
  drag.at = at; drag.block.title = clock(at);
  const label = $("#ph-label"); if (label) label.textContent = clock(at) + " (moving)";
});
let draggedAt = 0;
document.addEventListener("pointerup", async () => {
  const done = drag; drag = null;
  if (!done || !done.moved) return;
  draggedAt = Date.now();                     // the click that follows is part of the drag
  ui.cue = done.cue.id;
  ui.editorOpen = true;
  if (done.at === undefined || done.at === done.cue.at) { renderTimeline(); return; }
  ui.playhead = done.at;
  await saveShow(state.show.cues.map(c => c.id === done.cue.id ? { ...c, at: done.at } : c));
});
// Dragging the dock's own handle overrides the auto-sized looks row with a
// fixed height (clamp 90-600, wider than auto's 360 cap - the operator may
// want it bigger than what "fits" would give). Throttled to one layoutLooks
// per frame; #content's padding follows via syncDockSpacing() each frame too,
// so the tracks never end up hidden behind a dock that grew mid-drag.
let dockDrag = null;
document.addEventListener("pointerdown", e => {
  const handle = e.target.closest("#tl-dock-handle");
  if (!handle || e.button !== 0) return;
  e.preventDefault();
  dockDrag = { startY: e.clientY, startH: THUMBS.timeline.height, pending: null, raf: false, moved: false };
  try { handle.setPointerCapture(e.pointerId); } catch {}
});
document.addEventListener("pointermove", e => {
  if (!dockDrag) return;
  const dy = dockDrag.startY - e.clientY;
  // A no-move release (below) must commit nothing and never re-render, so a
  // dblclick on the handle still has the same element to fire on - like the
  // cue drag's own `moved` flag (fix round finding 7).
  if (!dockDrag.moved) {
    if (Math.abs(dy) < 3) return;
    dockDrag.moved = true;
    const handle = $("#tl-dock-handle"); if (handle) handle.classList.add("dragging");
  }
  const target = Math.round(Math.max(90, Math.min(600, dockDrag.startH + dy)));
  dockDrag.pending = target;
  if (dockDrag.raf) return;
  dockDrag.raf = true;
  requestAnimationFrame(() => {
    dockDrag && (dockDrag.raf = false);
    if (!dockDrag || dockDrag.pending === null) return;
    THUMBS.timeline.height = dockDrag.pending;
    // Set ui.dockCells now, not just on pointerup: syncDockSpacing() treats a
    // null ui.dockCells as "auto" and would otherwise recompute and overwrite
    // the height set above on every one of these frames, fighting the drag.
    ui.dockCells = dockDrag.pending;
    layoutLooks(THUMBS.timeline);
    syncDockSpacing();
  });
});
document.addEventListener("pointerup", e => {
  if (!dockDrag) return;
  const handle = $("#tl-dock-handle");
  if (handle) { try { handle.releasePointerCapture(e.pointerId); } catch {} }
  const done = dockDrag;
  dockDrag = null;
  if (!done.moved) return;            // a click that never moved the handle pins nothing
  if (handle) handle.classList.remove("dragging");
  // done.pending covers a release so quick the throttled rAF above never got
  // to run - without this a fast flick would commit the pre-drag height.
  ui.dockCells = done.pending ?? THUMBS.timeline.height;
  THUMBS.timeline.height = ui.dockCells;
  layoutLooks(THUMBS.timeline);
  saveDockCellsPref();
  renderTimeline();                  // picks up the "manual" label
});
document.addEventListener("dblclick", e => {
  if (!e.target.closest("#tl-dock-handle")) return;
  ui.dockCells = null;
  saveDockCellsPref();
  renderTimeline();                  // back to auto - updateDockThumbHeight() resizes it
});
let depth = 0;
// Files from outside only: a card dragged within the list is not an upload.
const carriesFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", e => { if (!carriesFiles(e)) return; e.preventDefault(); depth++; $("#drop").classList.add("on"); });
addEventListener("dragleave", e => { if (!carriesFiles(e)) return; if (--depth <= 0) { depth = 0; $("#drop").classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault(); depth = 0; $("#drop").classList.remove("on");
  if (!carriesFiles(e)) return;
  // filesFromDataTransfer() must see the DataTransfer before this
  // handler returns - it is synchronous up to its own first await.
  upload(await filesFromDataTransfer(e.dataTransfer));
});

refresh();
pollFleet();
</script>
